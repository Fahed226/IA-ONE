t** commente chaque matin les publications de 5 DSI et médias tech en ajoutant un vrai retour d'expérience. Plusieurs DSI commencent à le suivre après avoir lu ses commentaires, et deux l'invitent à intervenir dans leur podcast. Ses commentaires ont été sa meilleure source de visibilité les premiers mois."}], "key_takeaways": ["Au début, commenter chez les autres est aussi important que publier", "Un commentaire doit apporter de la valeur, jamais « Super post »", "Collaborez avec des profils complémentaires", "On partage ce qui est utile, ce qui fait bien paraître ou ce qui exprime notre avis", "Les tendances doivent servir votre positionnement"], "exercises": [{"title": "Plan de croissance de 30 jours", "instructions_markdown": "1. Listez 25 comptes stratégiques où se trouve votre persona.\n2. Tenez la routine des 20 minutes pendant 30 jours (cochez chaque jour).\n3. Identifiez 5 partenaires de collaboration possibles et envoyez 2 propositions.\n4. Créez 1 contenu « à partager » (ressource, opinion ou donnée originale).", "difficulty": "difficile", "estimated_minutes": 600, "solution_markdown": "**Modèle de proposition de collaboration** :\n\n*« Bonjour [prénom], je suis ton contenu sur [sujet] depuis quelques mois, en particulier ton post sur [exemple précis]. Je travaille avec [public] sur [sujet complémentaire]. Je pense que nos audiences se recoupent sans qu'on se fasse concurrence. Ça te dirait de faire un live de 30 minutes sur [sujet commun] ? Je m'occupe de préparer le déroulé. »*\n\nPourquoi ça marche : message personnalisé, bénéfice mutuel, proposition concrète et effort pris en charge.\n\n**Indicateurs à suivre au bout de 30 jours** : nombre de visites de profil, nouveaux abonnés venus de vos commentaires, réponses aux propositions."}], "common_mistakes": ["Commentaires génériques ou auto-promotionnels", "Proposer une collaboration sans jamais avoir interagi avec la personne", "Suivre toutes les tendances même hors sujet"], "resources": [{"title": "Show Your Work! (Montrez votre travail) — Austin Kleon", "type": "livre", "description": "Chapitres sur l'art de partager et de construire un réseau."}, {"title": "Podcasts de votre niche", "type": "outil", "description": "Listez ceux qui reçoivent des invités : ce sont des opportunités de visibilité."}], "video_script_markdown": "", "slides": []}}, {"id": "0019d6fc379d", "plan": {"title": "Mesurer, analyser, ajuster", "summary": "Suivre les bons indicateurs et améliorer sa stratégie grâce aux données.", "objectives": ["Distinguer indicateurs de vanité et indicateurs utiles", "Mettre en place un tableau de bord mensuel", "Tester et améliorer ses contenus de manière méthodique"], "duration_minutes": 25, "format": "texte + tableau de bord"}, "content": {"introduction_markdown": "Ce qui ne se mesure pas ne s'améliore pas. Mais mesurer les mauvais chiffres est pire : on optimise des vues au lieu d'optimiser des ventes. Cette leçon vous apprend à lire vos statistiques comme un tableau de bord d'entreprise.", "sections": [{"heading": "Vanité contre utilité", "content_markdown": "| Indicateur | Type | Ce qu'il dit |\n|---|---|---|\n| Nombre d'abonnés | Vanité (seul) | Taille, pas qualité |\n| Vues / impressions | Visibilité | Portée de l'accroche et du sujet |\n| Taux d'interaction | Utile | Pertinence du contenu |\n| Sauvegardes et partages | Très utile | Valeur perçue |\n| Visites de profil | Très utile | Curiosité envers **vous** |\n| Inscriptions e-mail | Business | Audience possédée |\n| Messages privés / rendez-vous | Business | Intention d'achat |\n| Clients et chiffre d'affaires | Business | Le vrai résultat |\n\nTaux d'interaction = (réactions + commentaires + partages + sauvegardes) ÷ vues × 100."}, {"heading": "Le tableau de bord mensuel", "content_markdown": "Une fois par mois, notez :\n\n1. Vos **3 meilleurs contenus** (par sauvegardes, commentaires ou prises de contact) et ce qu'ils ont en commun (sujet, format, accroche).\n2. Vos **3 moins bons** et une hypothèse pour chacun.\n3. Les chiffres business : inscrits, rendez-vous, ventes.\n4. **Une décision** pour le mois suivant (faire plus de…, arrêter…, tester…)."}, {"heading": "Tester méthodiquement", "content_markdown": "Changez **une seule variable à la fois** : l'accroche, le format, l'heure ou le sujet. Exemple : publier la même méthode en post texte une semaine, en carrousel la suivante. Comparez sur plusieurs contenus avant de conclure : un seul contenu qui fonctionne ou non peut être dû au hasard."}], "examples": [{"title": "La leçon des chiffres", "content_markdown": "Une coach constate que ses Reels humoristiques font beaucoup de vues mais aucune prise de contact, alors que ses carrousels « méthode » font moins de vues mais génèrent l'essentiel de ses rendez-vous. Décision : elle garde 1 Reel humoristique par semaine pour attirer et double ses carrousels méthode, en ajoutant un CTA vers son appel découverte."}], "key_takeaways": ["Les abonnés seuls sont un indicateur de vanité", "Suivez sauvegardes, visites de profil, inscrits, rendez-vous", "Bilan mensuel : top 3, flop 3, une décision", "Testez une variable à la fois, sur plusieurs contenus"], "exercises": [{"title": "Votre premier bilan", "instructions_markdown": "Exportez les statistiques de vos 10 derniers contenus. Calculez le taux d'interaction de chacun, identifiez le top 3 et le flop 3, trouvez un point commun à chaque groupe et formulez une décision pour le mois prochain.", "difficulty": "moyen", "estimated_minutes": 40, "solution_markdown": "**Exemple d'analyse** :\n\n- Top 3 : trois carrousels « étape par étape », accroches avec un chiffre, publiés le mardi. Point commun : **méthode concrète et chiffrée**.\n- Flop 3 : trois posts d'humeur sans conseil actionnable. Point commun : **pas de bénéfice clair pour le lecteur**.\n- Décision : *« Ce mois-ci, 2 carrousels méthode par semaine, et je transforme mes posts d'humeur en histoires avec une leçon concrète. »*\n\nSi vous avez moins de 10 contenus, faites l'exercice quand même : l'habitude compte plus que la taille de l'échantillon."}], "common_mistakes": ["Juger une stratégie sur un seul contenu", "Changer plusieurs choses à la fois", "Ne regarder que les vues"], "resources": [{"title": "Statistiques natives des plateformes", "type": "outil", "description": "LinkedIn, Instagram, TikTok et YouTube proposent des statistiques gratuites pour les comptes professionnels / créateurs."}, {"title": "Google Sheets", "type": "outil", "description": "Suffisant pour un tableau de bord mensuel simple."}], "video_script_markdown": "", "slides": []}}], "quiz": {"title": "Quiz — Exploser sur les réseaux", "instructions": "Choisissez la ou les bonnes réponses, puis validez pour voir les explications.", "passing_score_percent": 70, "questions": [{"question": "Quels signaux favorisent généralement la diffusion d'un contenu ?", "type": "choix_multiple", "options": ["Le temps passé sur le contenu", "Les commentaires et partages", "Les sauvegardes", "Le nombre de hashtags, plus il y en a mieux c'est"], "correct_indexes": [0, 1, 2], "explanation": "Les plateformes privilégient ce qui retient et engage les utilisateurs ; accumuler des hashtags n'est pas un levier fiable.", "bloom_level": "comprendre"}, {"question": "Quelle bio est la plus efficace ?", "type": "choix_unique", "options": ["Passionnée | Maman | Café addict", "J'aide les thérapeutes à remplir leur agenda avec Instagram | +120 praticiens accompagnés | Guide gratuit ci-dessous", "Bienvenue sur mon compte", "Entrepreneur – Visionnaire – Leader"], "correct_indexes": [1], "explanation": "Elle indique pour qui, quel résultat, une preuve et une action.", "bloom_level": "évaluer"}, {"question": "Un bon commentaire stratégique sur le post d'un autre créateur, c'est :", "type": "choix_unique", "options": ["« Super post ! »", "Un lien vers votre offre", "Un complément argumenté ou un exemple concret qui apporte de la valeur", "Un emoji"], "correct_indexes": [2], "explanation": "Un commentaire utile est un mini-contenu vu par la cible.", "bloom_level": "appliquer"}, {"question": "Pour tester l'effet du format, on change en même temps l'accroche, l'heure et le sujet.", "type": "vrai_faux", "options": ["Vrai", "Faux"], "correct_indexes": [1], "explanation": "On change une seule variable à la fois pour savoir ce qui a produit l'effet.", "bloom_level": "analyser"}, {"question": "Quel indicateur est le plus proche du résultat business ?", "type": "choix_unique", "options": ["Nombre d'abonnés", "Impressions", "Rendez-vous et messages privés qualifiés", "Nombre de « j'aime »"], "correct_indexes": [2], "explanation": "Les conversations et rendez-vous traduisent une intention d'achat.", "bloom_level": "évaluer"}]}}, {"id": "d67195c6ffe0", "title": "Vendre grâce à son image", "summary": "Construire son offre, transformer son audience en clients et installer sa réputation dans la durée.", "objectives": ["Créer une offre à forte valeur perçue", "Mettre en place un parcours de vente", "Utiliser la preuve sociale et durer"], "lessons": [{"id": "168af0fb958d", "plan": {"title": "Construire une offre irrésistible", "summary": "Créer une offre claire qui prolonge naturellement votre marque et vos contenus.", "objectives": ["Structurer une offre autour d'une transformation", "Construire une échelle d'offres", "Fixer un prix cohérent avec la valeur perçue"], "duration_minutes": 35, "format": "atelier"}, "content": {"introduction_markdown": "Une audience sans offre, c'est de la notoriété qui ne paie pas les factures. Une offre bien construite est le **prolongement naturel** de ce que vous enseignez déjà dans vos contenus.", "sections": [{"heading": "Vendre une transformation, pas des heures", "content_markdown": "Votre client n'achète pas « 6 séances de coaching » : il achète **le passage d'une situation A à une situation B**.\n\n| Mauvaise formulation | Bonne formulation |\n|---|---|\n| 6 séances d'1 h de coaching LinkedIn | En 6 semaines, un profil et une routine de publication qui vous amènent vos premiers rendez-vous clients |\n| Formation Canva de 4 h | Créez tous vos visuels du mois en 2 heures, sans graphiste |\n\nUne offre claire répond à : **pour qui, quel résultat, en combien de temps, comment, avec quelles garanties.**"}, {"heading": "L'échelle d'offres", "content_markdown": "Proposez plusieurs niveaux pour accompagner la montée en confiance :\n\n1. **Gratuit** : contenus, ressource téléchargeable (lead magnet) en échange d'un e-mail.\n2. **Petit prix** : guide, modèle, atelier (quelques dizaines d'euros). Transforme un abonné en client.\n3. **Offre principale** : programme, accompagnement, formation complète.\n4. **Premium** : accompagnement individuel, done-for-you, conseil.\n\nChaque niveau doit donner un vrai résultat **et** donner envie du suivant."}, {"heading": "Augmenter la valeur perçue", "content_markdown": "La valeur perçue dépend de 4 facteurs :\n\n- ⬆️ **Le résultat promis** (plus il est important et concret)\n- ⬆️ **La probabilité perçue de l'obtenir** (preuves, méthode, garanties)\n- ⬇️ **Le délai** avant résultat\n- ⬇️ **L'effort et les sacrifices** demandés\n\nAjoutez des éléments qui agissent sur ces leviers : modèles prêts à l'emploi (moins d'effort), suivi (plus de probabilité), bonus de démarrage rapide (délai réduit)."}, {"heading": "Le prix", "content_markdown": "Fixez-le par rapport à **la valeur du résultat** pour le client, pas à votre temps. Si votre accompagnement aide un freelance à signer un client à 3 000 €, un prix de 900 € reste un bon investissement pour lui. Votre marque personnelle vous permet de vous positionner au-dessus de la moyenne : **plus vous êtes perçu comme la référence, moins on vous compare sur le prix.**"}], "examples": [{"title": "Une échelle complète", "content_markdown": "Une photographe culinaire construit : **gratuit** → guide « 10 réglages pour photographier vos plats au smartphone » ; **petit prix** → pack de préréglages à 29 € ; **offre principale** → formation en ligne « Photos de restaurant qui donnent faim » à 390 € ; **premium** → shooting sur place pour restaurants."}], "key_takeaways": ["On vend une transformation : de A vers B", "Pour qui, quel résultat, quel délai, quelle méthode, quelles garanties", "Échelle : gratuit → petit prix → offre principale → premium", "Valeur perçue : résultat et probabilité ↑, délai et effort ↓", "Le prix se fixe sur la valeur du résultat"], "exercises": [{"title": "Fiche offre", "instructions_markdown": "Rédigez la fiche de votre offre principale : nom, promesse (A → B), public, durée, contenu, bonus, garantie, prix. Puis imaginez votre ressource gratuite et votre offre à petit prix.", "difficulty": "difficile", "estimated_minutes": 60, "solution_markdown": "**Exemple corrigé** :\n\n- **Nom** : Le Programme Agenda Plein\n- **Promesse** : passer d'un agenda à moitié vide à 10 nouveaux patients par mois grâce à Instagram, en 90 jours.\n- **Public** : ostéopathes et kinés installés depuis moins de 5 ans.\n- **Contenu** : 6 modules vidéo, 30 modèles de publications, 1 appel de groupe par semaine.\n- **Bonus** : audit personnalisé du profil (augmente la probabilité perçue).\n- **Garantie** : si vous appliquez la méthode 60 jours sans résultat, accompagnement prolongé gratuitement.\n- **Prix** : 690 €.\n- **Gratuit** : checklist « Le profil Instagram qui remplit un cabinet ».\n- **Petit prix** : 30 modèles de posts à 27 €.\n\nVérifiez que votre promesse est **crédible** : ne promettez que des résultats que vous avez déjà obtenus pour vous ou pour des clients."}], "common_mistakes": ["Vendre du temps au lieu d'un résultat", "N'avoir qu'une offre très chère sans étape intermédiaire", "Promettre des résultats qu'on ne peut pas prouver"], "resources": [{"title": "$100M Offers — Alex Hormozi", "type": "livre", "description": "Méthode détaillée pour construire une offre à forte valeur perçue (en anglais)."}], "video_script_markdown": "", "slides": []}}, {"id": "860e0e639dab", "plan": {"title": "Transformer son audience en clients", "summary": "Mettre en place le parcours qui mène de l'abonné au client : lead magnet, e-mail et messages privés.", "objectives": ["Créer un lead magnet et une séquence e-mail", "Mener des conversations de vente en message privé sans être intrusif", "Réaliser un appel découverte qui convertit"], "duration_minutes": 35, "format": "atelier + scripts"}, "content": {"introduction_markdown": "Vendre grâce à son image, ce n'est pas publier « achetez ma formation » en espérant que ça marche. C'est construire un **parcours** où chaque étape rapproche naturellement la personne de l'achat.", "sections": [{"heading": "Le parcours type", "content_markdown": "1. **Contenu** (réseaux) → la personne vous découvre.\n2. **Profil** → elle comprend ce que vous faites.\n3. **Lead magnet** → elle vous donne son e-mail contre une ressource utile.\n4. **Séquence e-mail** → elle apprend à vous faire confiance.\n5. **Conversation / appel découverte** → vous vérifiez ensemble que l'offre lui convient.\n6. **Achat**."}, {"heading": "Le lead magnet et la séquence de bienvenue", "content_markdown": "Un bon lead magnet résout **un petit problème précis, rapidement** : checklist, modèle, mini-formation vidéo, quiz. Il doit être directement lié à votre offre payante.\n\nSéquence de bienvenue (5 e-mails sur 10 jours) :\n\n1. Livraison de la ressource + qui vous êtes\n2. Votre histoire (leçon 1.3)\n3. Une erreur fréquente et comment l'éviter\n4. Une étude de cas client\n5. Présentation de l'offre + invitation à un appel ou à l'achat"}, {"heading": "La vente en message privé, sans forcer", "content_markdown": "Principes :\n\n- **Répondez aux signaux**, ne démarchez pas à froid en masse : quelqu'un qui commente « c'est exactement mon problème », qui télécharge votre ressource, qui répond à une story.\n- **Commencez par une question**, pas par un lien : *« Merci pour ton commentaire ! C'est quoi ta situation actuelle avec [sujet] ? »*\n- **Écoutez**, reformulez, puis proposez **seulement si c'est pertinent** : *« Ce que tu décris, c'est exactement ce qu'on travaille dans [offre]. Tu veux qu'on en parle 20 minutes ? »*\n- Acceptez le « non » avec élégance : la relation vaut plus qu'une vente."}, {"heading": "L'appel découverte en 5 étapes", "content_markdown": "1. **Cadre** : « On a 30 minutes, je vais te poser des questions, et à la fin on voit si je peux t'aider. D'accord ? »\n2. **Situation actuelle** : où en es-tu ?\n3. **Objectif** : où veux-tu être dans 6 mois ? Pourquoi c'est important maintenant ?\n4. **Obstacles** : qu'est-ce qui t'en empêche ?\n5. **Proposition** : si c'est adapté, présentez l'offre comme le pont entre sa situation et son objectif, puis demandez clairement : « Est-ce que tu veux qu'on y aille ensemble ? »\n\nLe prospect doit parler environ **70 % du temps**."}], "examples": [{"title": "Un commentaire devenu client", "content_markdown": "Sous un post sur la prise de parole, une manager commente : *« Je bloque complètement en réunion de direction. »* La formatrice lui écrit : *« Merci de l'avoir partagé, c'est très courant. Ça se passe comment concrètement ? »* Après quelques échanges, elle propose un appel ; la manager rejoint son programme. **Aucune relance insistante : de l'écoute et une proposition au bon moment.**"}], "key_takeaways": ["Contenu → profil → lead magnet → e-mails → conversation → achat", "Le lead magnet résout vite un petit problème lié à l'offre", "En message privé : question d'abord, lien ensuite", "Appel découverte : cadre, situation, objectif, obstacles, proposition", "Le prospect parle 70 % du temps"], "exercises": [{"title": "Votre parcours de vente", "instructions_markdown": "1. Choisissez votre lead magnet et rédigez son titre.\n2. Écrivez le plan de votre séquence de 5 e-mails (objet + idée principale de chacun).\n3. Rédigez votre script de premier message privé en réponse à un commentaire.", "difficulty": "difficile", "estimated_minutes": 60, "solution_markdown": "**Exemple d'objets d'e-mails** (thème : prise de parole) :\n\n1. *Ton guide « 5 minutes avant de parler » est là*\n2. *La réunion où j'ai perdu mes mots (et ce qu'elle m'a appris)*\n3. *L'erreur que font 9 managers sur 10 en début de réunion*\n4. *Comment Sophie a présenté son budget sans trembler*\n5. *Les inscriptions à « Voix de leader » sont ouvertes*\n\n**Script de message privé** :\n*« Merci pour ton commentaire [prénom] ! Tu parlais de [reprendre ses mots]. Ça se passe comment pour toi en ce moment ? »*\n\nÀ éviter : envoyer directement un lien de vente, copier-coller le même message à 50 personnes."}], "common_mistakes": ["Envoyer des messages de vente automatiques à des inconnus", "Proposer l'offre sans avoir compris le besoin", "Parler plus que le prospect pendant l'appel"], "resources": [{"title": "Brevo / Kit / MailerLite", "type": "outil", "description": "Outils d'e-mailing pour lead magnet et séquences automatiques."}, {"title": "Calendly / Google Agenda (prise de rendez-vous)", "type": "outil", "description": "Permet aux prospects de réserver un appel découverte en un clic."}], "video_script_markdown": "", "slides": []}}, {"id": "9cbd0a2b534f", "plan": {"title": "Preuve sociale, réputation et durée", "summary": "Renforcer la confiance avec les témoignages, protéger sa réputation et installer sa marque dans le temps.", "objectives": ["Collecter et utiliser des témoignages et études de cas", "Gérer les critiques et protéger son e-réputation", "Planifier sa marque sur 12 mois"], "duration_minutes": 30, "format": "texte + plan"}, "content": {"introduction_markdown": "Ce que vous dites de vous est une promesse ; ce que vos clients disent de vous est une **preuve**. Une marque forte se construit sur des preuves accumulées, une réputation protégée et une présence qui dure.", "sections": [{"heading": "Collecter la preuve sociale", "content_markdown": "- **Demandez systématiquement** un retour à la fin de chaque accompagnement, au moment où la satisfaction est la plus haute.\n- **Posez des questions guidées** : *Quelle était ta situation avant ? Qu'est-ce qui t'a fait hésiter ? Qu'est-ce qui a changé concrètement ? À qui recommanderais-tu cet accompagnement ?*\n- **Privilégiez les formats crédibles** : vidéo, capture de message avec accord, résultat chiffré, nom et photo réels (avec autorisation).\n- **Transformez les meilleurs en études de cas** : contexte, problème, solution, résultat chiffré."}, {"heading": "Gérer les critiques", "content_markdown": "Plus vous êtes visible, plus vous recevrez de critiques. Méthode :\n\n1. **Ne répondez jamais à chaud.**\n2. **Distinguez** critique constructive (à remercier et utiliser), désaccord d'opinion (à discuter avec respect) et attaque gratuite (à ignorer ou modérer).\n3. **Répondez publiquement avec calme** quand c'est utile : l'audience juge surtout votre réaction.\n4. **Réglez les problèmes clients en privé**, rapidement.\n\nVotre e-réputation, c'est aussi ce que l'on trouve en tapant votre nom sur un moteur de recherche : vérifiez-le régulièrement."}, {"heading": "Tenir dans la durée", "content_markdown": "La plupart des marques personnelles échouent par **abandon**, pas par manque de talent. Pour durer :\n\n- Un rythme réaliste (leçon 2.3) et un système de production (leçon 3.3).\n- Des **objectifs trimestriels** mesurables (inscrits, clients), pas seulement des abonnés.\n- Une **évolution progressive** : élargir sa niche, ajouter un format, lancer un produit, une fois les bases solides.\n- Des pauses **planifiées** plutôt que des disparitions : prévenez votre audience et programmez du contenu à l'avance."}], "examples": [{"title": "Étude de cas bien construite", "content_markdown": "*« **Contexte** : Nadia, architecte d'intérieur, 3 ans d'activité, clients uniquement par bouche-à-oreille. **Problème** : des mois creux imprévisibles. **Solution** : positionnement sur les petites surfaces parisiennes, 3 carrousels « avant / après » par semaine, guide gratuit « Agrandir visuellement un studio ». **Résultat** : 340 inscrits à sa liste en 4 mois et 4 projets signés venant d'Instagram. »*\n\nCette structure permet au lecteur de se projeter : **« si elle y est arrivée dans ma situation, moi aussi. »**"}], "key_takeaways": ["Ce que vos clients disent de vous vaut plus que ce que vous en dites", "Demandez les témoignages au moment de la satisfaction", "Étude de cas : contexte, problème, solution, résultat chiffré", "Ne répondez jamais à chaud aux critiques", "Les marques échouent surtout par abandon : planifiez la durée"], "exercises": [{"title": "Plan de marque sur 12 mois", "instructions_markdown": "Rédigez votre feuille de route sur 4 trimestres. Pour chacun : 1 objectif business mesurable, 1 objectif d'audience, 1 action de preuve sociale, 1 projet (nouveau format, collaboration, produit).", "difficulty": "moyen", "estimated_minutes": 45, "solution_markdown": "**Exemple de feuille de route** :\n\n| Trimestre | Business | Audience | Preuve sociale | Projet |\n|---|---|---|---|---|\n| T1 | 3 clients offre principale | 300 inscrits e-mail | 3 témoignages écrits | Lead magnet + séquence e-mail |\n| T2 | 6 clients | 700 inscrits | 1 étude de cas vidéo | 4 collaborations en live |\n| T3 | Lancement offre petit prix : 50 ventes | 1 200 inscrits | Page témoignages | Réseau secondaire |\n| T4 | 10 clients + 1 premium | 2 000 inscrits | 5 études de cas | Programme de groupe |\n\nLes chiffres sont des exemples : fixez les vôtres selon votre point de départ, et révisez le plan à la fin de chaque trimestre avec votre bilan mensuel."}], "common_mistakes": ["Publier des témoignages sans autorisation ou invérifiables", "Répondre aux critiques sous le coup de l'émotion", "Disparaître plusieurs semaines sans prévenir"], "resources": [{"title": "Google Alertes", "type": "outil", "description": "Recevoir une alerte quand votre nom ou votre marque est mentionné en ligne."}, {"title": "Senja / Testimonial.to", "type": "outil", "description": "Collecte et affichage de témoign         <h3>${esc(m.title)}</h3>
        <p class="sum">${esc(m.summary)}</p>
        <div class="rows">
          ${m.lessons.map((l, j) => `<a class="row ${S.done[l.id] ? "done" : ""}" href="#l-${l.id}"><span class="k">${i + 1}.${j + 1}</span><span class="t">${esc(l.plan.title)}<small>${esc(l.plan.summary)}</small></span><span class="d">${fmt(l.plan.duration_minutes)}</span><span class="check">${S.done[l.id] ? "✓" : ""}</span></a>`).join("")}
          ${m.quiz ? `<a class="row quiz ${S.quiz[i] >= m.quiz.passing_score_percent ? "done" : ""}" href="#evaluations" data-quiz="${i}"><span class="k">Q</span><span class="t">Évaluation de l'acte ${ROMAN[i]}</span><span class="d">${S.quiz[i] != null ? S.quiz[i] + " %" : m.quiz.questions.length + " questions"}</span><span class="check">${S.quiz[i] >= m.quiz.passing_score_percent ? "✓" : ""}</span></a>` : ""}
        </div>
      </div>
    </article>`).join("")}
  </section>`;
  $$("[data-quiz]").forEach((a) => a.addEventListener("click", () => { Q = newQ(+a.dataset.quiz); }));
}

/* ------------------------------------------------ leçon */
function vLesson(id) {
  const k = ALL.findIndex((x) => x.l.id === id);
  if (k < 0) return go("accueil");
  const { m, mi, l, key } = ALL[k], c = l.content, prev = ALL[k - 1], next = ALL[k + 1];
  app.innerHTML = `
  <div class="lesson">
    <article>
      <header class="lhead">
        <span class="eyebrow">Acte ${ROMAN[mi]} · Leçon ${key}</span>
        <h1>${esc(l.plan.title)}</h1>
        <div class="lmeta"><span>${fmt(l.plan.duration_minutes)}</span><span>${esc(l.plan.format)}</span><span>${esc(m.title)}</span></div>
        <ul class="objs">${l.plan.objectives.map((o, n) => `<li><span>0${n + 1}</span>${esc(o)}</li>`).join("")}</ul>
      </header>
      <div class="prose">
        <div class="lead-p">${md(c.introduction_markdown)}</div>
        ${c.sections.map((s, n) => `<h2 id="s${n}">${esc(s.heading)}</h2>${md(s.content_markdown)}`).join("")}
      </div>
      ${c.examples.map((e) => `<div class="case"><span class="eyebrow">Cas réel</span><h3>${esc(e.title)}</h3><div class="prose">${md(e.content_markdown)}</div></div>`).join("")}
      <div class="prose"><h2 id="retenir">L'essentiel</h2></div>
      <div class="keys">${c.key_takeaways.map((t, n) => `<div><b>${n + 1}</b><span>${esc(t)}</span></div>`).join("")}</div>
      <div class="prose"><h3>Les pièges à éviter</h3></div>
      <div class="pitfalls">${c.common_mistakes.map((t) => `<div>${esc(t)}</div>`).join("")}</div>
      ${c.exercises.map((e, n) => { const nk = `${l.id}-${n}`; return `
      <section class="work" id="atelier">
        <div class="wh"><h3>Atelier · ${esc(e.title)}</h3><span class="eyebrow" style="color:var(--muted)">${esc(e.difficulty)} · ${e.estimated_minutes} min</span></div>
        <div class="wb">
          <div class="prose">${md(e.instructions_markdown)}</div>
          <label for="note-${n}" class="eyebrow" style="display:block;margin-top:22px;color:var(--muted)">Votre travail — enregistré automatiquement</label>
          <textarea id="note-${n}" data-note="${nk}" placeholder="Rédigez ici votre réponse. Elle sera conservée dans « Mon cahier ».">${esc(S.notes[nk] || "")}</textarea>
          <div class="saved" id="saved-${n}"></div>
          <button type="button" class="link" data-sol="${n}">Afficher le corrigé de l'expert</button>
          <div class="sol prose" id="sol-${n}" hidden>${md(e.solution_markdown)}</div>
        </div>
      </section>`; }).join("")}
      <div class="prose"><h3>Pour aller plus loin</h3></div>
      <div class="refs">${c.resources.map((r) => `<div><i>${esc(r.type)}</i><span><b>${esc(r.title)}</b> — ${esc(r.description)}</span></div>`).join("")}</div>
      <div class="finish"><span class="muted">${S.done[l.id] ? "Leçon validée." : "Terminé ? Validez la leçon pour suivre votre progression."}</span>
        <button type="button" class="btn ${S.done[l.id] ? "" : "gold"}" id="mark">${S.done[l.id] ? "✓ Leçon validée" : "Valider la leçon"}</button></div>
      <nav class="pager">
        ${prev ? `<a href="#l-${prev.l.id}"><small>← Leçon ${prev.key}</small>${esc(prev.l.plan.title)}</a>` : ""}
        ${next ? `<a class="next" href="#l-${next.l.id}"><small>Leçon ${next.key} →</small>${esc(next.l.plan.title)}</a>` : `<a class="next" href="#evaluations" data-exam="1"><small>Dernière étape →</small>L'examen final</a>`}
      </nav>
    </article>
    <aside class="aside">
      <div><span class="eyebrow" style="color:var(--muted)">Dans cette leçon</span>
        <ol>${c.sections.map((s, n) => `<li><a href="#l-${l.id}" data-jump="s${n}">${esc(s.heading)}</a></li>`).join("")}<li><a href="#l-${l.id}" data-jump="retenir">L'essentiel</a></li><li><a href="#l-${l.id}" data-jump="atelier">Atelier</a></li></ol></div>
      <div><span class="eyebrow" style="color:var(--muted)">Acte ${ROMAN[mi]}</span>
        <ol>${m.lessons.map((x, j) => `<li><a href="#l-${x.id}" class="${x.id === l.id ? "cur" : ""}">${mi + 1}.${j + 1} · ${esc(x.plan.title)}${S.done[x.id] ? " ✓" : ""}</a></li>`).join("")}</ol></div>

  </div>`;
  $$("[data-sol]").forEach((b) => b.onclick = () => { const s = $("#sol-" + b.dataset.sol); s.hidden = !s.hidden; b.textContent = s.hidden ? "Afficher le corrigé de l'expert" : "Masquer le corrigé"; });
  $$("[data-jump]").forEach((a) => a.onclick = (e) => { e.preventDefault(); e.stopPropagation(); document.getElementById(a.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" }); });
  $$("[data-note]").forEach((t) => { let tm; t.oninput = () => { S.notes[t.dataset.note] = t.value; clearTimeout(tm); tm = setTimeout(() => { save(); const s = $("#saved-" + t.id.split("-")[1]); if (s) s.textContent = "Enregistré"; }, 400); }; });
  $("[data-exam]")?.addEventListener("click", () => { Q = newQ("exam"); });
  $("#mark").onclick = () => { S.done[l.id] = !S.done[l.id]; save(); meter(); if (S.done[l.id] && next) go("l-" + next.l.id); else vLesson(l.id); };
}

/* ------------------------------------------------ révision */
let deck = "tout";
function vReview() {
  const cards = [];
  C.extras.glossary.forEach((g) => cards.push({ t: "notions", label: "Notion", front: g.term, back: `<p style="margin:0;font-size:17px">${esc(g.definition)}</p>` }));
  ALL.forEach((x) => cards.push({ t: "essentiel", label: `Leçon ${x.key}`, front: x.l.plan.title, back: `<ul>${x.l.content.key_takeaways.map((k) => `<li>${esc(k)}</li>`).join("")}</ul>` }));
  const shown = cards.filter((c) => deck === "tout" || c.t === deck);
  app.innerHTML = `
  <header class="page-head"><div><span class="eyebrow">Révision</span><h1>Les <em>cartes</em>.</h1><p>Lisez le recto, formulez la réponse de tête, puis retournez la carte. ${shown.length} cartes.</p></div>
    <div class="seg" id="seg">${[["tout", "Toutes"], ["notions", "Notions"], ["essentiel", "L'essentiel"]].map(([k, v]) => `<button type="button" data-d="${k}" class="${deck === k ? "on" : ""}">${v}</button>`).join("")}<button type="button" id="mix">Mélanger</button></div></header>
  <div class="deck" id="deck">${shown.map((c) => `<button type="button" class="flip" aria-label="${esc(c.front)}, retourner la carte"><div class="in"><div class="f"><span class="eyebrow">${esc(c.label)}</span><h4>${esc(c.front)}</h4><span class="foot"><span>Recto</span><span>Retourner ↻</span></span></div><div class="b">${c.back}</div></div></button>`).join("")}</div>`;
  $("#seg").onclick = (e) => { const b = e.target.closest("[data-d]"); if (b) { deck = b.dataset.d; vReview(); } };
  $("#mix").onclick = () => { const d = $("#deck"); [...d.children].sort(() => Math.random() - .5).forEach((n) => d.appendChild(n)); };
  $("#deck").onclick = (e) => { const b = e.target.closest(".flip"); if (b) b.classList.toggle("on"); };
}

/* ------------------------------------------------ évaluations */
const LIST = () => [...C.modules.map((m, i) => ({ i, n: ROMAN[i], title: `Acte ${ROMAN[i]}`, sub: m.title, q: m.quiz })), { i: "exam", n: "★", title: "Examen final", sub: "Toute la masterclass", q: C.final_exam }];
let Q = null;
const newQ = (i) => ({ i, n: 0, answers: [], picked: [], checked: false });
function vEval() {
  if (!Q) Q = newQ(0);
  const L = LIST(), cur = L.find((x) => x.i === Q.i), q = cur.q, s = Q, end = s.n >= q.questions.length;
  let body;
  if (end) {
    const sc = Math.round(100 * s.answers.filter(Boolean).length / q.questions.length), ok = sc >= q.passing_score_percent;
    S.quiz[s.i] = Math.max(sc, S.quiz[s.i] || 0); save();
    body = `<div class="result"><span class="eyebrow">${esc(cur.title)} · résultat</span><div class="big ${ok ? "ok" : ""}">${sc}<span style="font-size:.4em">%</span></div>
      <p style="font-size:18px">${ok ? "Validé." : `Seuil de validation : ${q.passing_score_percent} %. Relisez les explications, puis recommencez.`}</p>
      <div class="btns" style="justify-content:center"><button type="button" class="btn" id="again">Recommencer</button>${typeof s.i === "number" ? `<button type="button" class="btn gold" id="nextq">${s.i < C.modules.length - 1 ? "Évaluation suivante" : "Examen final"} →</button>` : `<a class="btn gold" href="#cahier">Voir mon certificat →</a>`}</div></div>`;
  } else {
    const x = q.questions[s.n], multi = x.correct_indexes.length > 1;
    body = `<div class="qsteps">${q.questions.map((_, n) => `<i class="${n < s.n ? (s.answers[n] ? "ok" : "ko") : n === s.n ? "cur" : ""}"></i>`).join("")}</div>
      <span class="eyebrow" style="color:var(--muted)">Question ${s.n + 1} sur ${q.questions.length}${multi ? " · plusieurs réponses" : ""}</span>
      <h2 style="margin-top:12px">${esc(x.question)}</h2>
      <div class="opts">${x.options.map((o, j) => { let c = s.picked.includes(j) ? "sel" : ""; if (s.checked) c = x.correct_indexes.includes(j) ? "good" : s.picked.includes(j) ? "bad" : ""; return `<button type="button" class="opt ${c}" data-o="${j}" ${s.checked ? "disabled" : ""}><span class="l">${"ABCDEF"[j]}</span><span>${esc(o)}</span></button>`; }).join("")}</div>
      ${s.checked ? `<div class="expl"><b>${s.answers[s.n] ? "Exact." : "Pas tout à fait."}</b> ${esc(x.explanation)}</div>` : ""}
      <div class="qfoot"><span class="eyebrow" style="color:var(--faint)">Seuil ${q.passing_score_percent} %</span>
        ${s.checked ? `<button type="button" class="btn gold" id="go">${s.n + 1 < q.questions.length ? "Question suivante →" : "Voir le résultat"}</button>` : `<button type="button" class="btn gold" id="ck" ${s.picked.length ? "" : "disabled"}>Valider</button>`}</div>`;
  }
  app.innerHTML = `
  <header class="page-head"><div><span class="eyebrow">Évaluations</span><h1>Mesurez votre <em>maîtrise</em>.</h1><p>Une évaluation par acte et un examen final. Votre meilleur score est conservé.</p></div></header>
  <div class="eval"><nav class="qnav" id="qnav">${L.map((x) => `<button type="button" data-q="${x.i}" class="${x.i === s.i ? "on" : ""}"><span class="n">${x.n}</span><span>${esc(x.title)}<small>${esc(x.sub)}</small></span><span class="s">${S.quiz[x.i] != null ? S.quiz[x.i] + " %" : ""}</span></button>`).join("")}</nav>
  <div class="qbox">${body}</div></div>`;
  $("#qnav").onclick = (e) => { const b = e.target.closest("[data-q]"); if (b) { Q = newQ(b.dataset.q === "exam" ? "exam" : +b.dataset.q); vEval(); } };
  $$(".opt").forEach((b) => b.onclick = () => { const j = +b.dataset.o, x = q.questions[s.n]; s.picked = x.correct_indexes.length > 1 ? (s.picked.includes(j) ? s.picked.filter((v) => v !== j) : [...s.picked, j]) : [j]; vEval(); });
  $("#ck")?.addEventListener("click", () => { const x = q.questions[s.n]; s.answers[s.n] = [...s.picked].sort().join() === [...x.correct_indexes].sort().join(); s.checked = true; vEval(); });
  $("#go")?.addEventListener("click", () => { s.n++; s.picked = []; s.checked = false; vEval(); });
  $("#again")?.addEventListener("click", () => { Q = newQ(s.i); vEval(); });
  $("#nextq")?.addEventListener("click", () => { Q = newQ(s.i < C.modules.length - 1 ? s.i + 1 : "exam"); vEval(); });
}

  app.innerHTML = `
  <header class="page-head"><div><span class="eyebrow">Projet d'application · ${p.estimated_hours} h</span><h1>${esc(p.title)}<em>.</em></h1></div></header>
  <div class="prose" style="max-width:72ch">${md(p.context_markdown)}</div>
  <h3 style="font-size:30px;margin:48px 0 14px">Le calendrier</h3>
  <div class="cal">${Array.from({ length: 30 }, (_, n) => `<i class="${ph(n + 1)}">${n + 1}</i>`).join("")}</div>
  <div class="legend"><span><i style="background:var(--brass)"></i>Fondations</span><span><i style="background:color-mix(in srgb,var(--brass) 55%,var(--bg))"></i>Plan éditorial</span><span><i style="background:color-mix(in srgb,var(--brass) 22%,var(--bg))"></i>Publier, grandir, vendre</span><span><i style="background:var(--wine)"></i>Bilan</span></div>
  <div class="steps">${p.steps.map((s) => { const [d, ...r] = s.split(" : "); return `<div><b>${esc(d)}</b><span>${esc(r.join(" : "))}</span></div>`; }).join("")}</div>
  <div class="cols">
    <div><h3>Les livrables</h3><ul class="dl">${p.deliverables.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div>
    <div><h3>La grille · 100 points</h3><div class="rub">${p.rubric.map((r) => `<div><div class="top2"><b>${esc(r.criterion)}</b><span>${r.points}</span></div><p>${esc(r.description)}</p><div class="bar"><i style="width:${r.points * 4}%"></i></div></div>`).join("")}</div></div>
  </div>
  <div class="cols">
    <div><h3>Pour bien suivre</h3><div class="prose">${md(x.how_to_follow_markdown)}</div></div>
    <div class="faq"><h3>Questions fréquentes</h3>${x.faq.map((f) => `<details><summary>${esc(f.title)}</summary><div class="prose" style="margin-top:10px">${md(f.content_markdown)}</div></details>`).join("")}</div>

/* ------------------------------------------------ cahier + certificat */
function workbookText() {
  const lines = [`SIGNATURE — Mon cahier de travail${S.name ? " · " + S.name : ""}`, ""];
  ALL.forEach((x) => x.l.content.exercises.forEach((e, n) => { const v = S.notes[`${x.l.id}-${n}`]; lines.push(`■ ${x.key} · ${x.l.plan.title} — ${e.title}`, v ? v : "(pas encore rédigé)", ""); }));
  return lines.join("\n");
}
function vBook() {
  const filled = ALL.filter((x) => S.notes[`${x.l.id}-0`]).length;
  const passedModules = C.modules.every((m, i) => (S.quiz[i] || 0) >= m.quiz.passing_score_percent);
  const passedExam = (S.quiz.exam || 0) >= C.final_exam.passing_score_percent;
  const allDone = doneN() === ALL.length;
  const ok = allDone && passedModules && passedExam;
  app.innerHTML = `
  <header class="page-head"><div><span class="eyebrow">Mon cahier</span><h1>Votre marque, <em>noir sur blanc</em>.</h1><p>Toutes vos réponses aux ateliers, dans l'ordre du programme. ${filled} atelier(s) sur ${ALL.length} rédigé(s).</p></div>
    <div class="btns"><button type="button" class="btn" id="copy">Copier tout le cahier</button></div></header>
  <p class="saved" id="copy-msg"></p>
  <textarea id="copy-area" readonly hidden style="width:100%;min-height:200px"></textarea>
  <div class="book">${ALL.map((x) => x.l.content.exercises.map((e, n) => { const v = S.notes[`${x.l.id}-${n}`]; return `<div class="entry"><span class="k">${x.key}</span><div><h4>${esc(e.title)}</h4><p class="muted" style="margin:0 0 8px;font-size:14px">${esc(x.l.plan.title)} · <a href="#l-${x.l.id}">ouvrir la leçon</a></p>${v ? `<pre>${esc(v)}</pre>` : `<p class="empty">Pas encore rédigé.</p>`}</div></div>`; }).join("")).join("")}</div>

  <section class="cert">
    <div class="in">
      <span class="eyebrow">Certificat de réussite</span>
      <h2>Masterclass <em>Signature</em></h2>
      <p class="muted" style="margin:0">Personal branding · ${fmt(TOTAL_MIN)} de formation · projet d'application de 30 jours</p>
      <div class="name">${esc(S.name) || "Votre nom"}</div>
      <p style="max-width:52ch;margin:0 auto 20px">${ok ? "a suivi l'intégralité du programme et validé l'ensemble des évaluations." : "Le certificat se débloque lorsque les conditions ci-dessous sont remplies."}</p>
      <label for="cert-name" class="eyebrow" style="display:block;color:var(--muted);margin-bottom:8px">Nom affiché sur le certificat</label>
      <input id="cert-name" value="${esc(S.name)}" placeholder="Prénom Nom">
      <div class="reqs"><span class="${allDone ? "ok" : ""}">${doneN()}/${ALL.length} leçons</span><span class="${passedModules ? "ok" : ""}">Évaluations des actes</span><span class="${passedExam ? "ok" : ""}">Examen final ≥ ${C.final_exam.passing_score_percent} %</span></div>
    </div>
  </section>`;
  $("#cert-name").oninput = (e) => { S.name = e.target.value; save(); $(".cert .name").textContent = S.name || "Votre nom"; };
  $("#copy").onclick = async () => {
    const t = workbookText(), area = $("#copy-area");
    try { await navigator.clipboard.writeText(t); $("#copy-msg").textContent = "Cahier copié. Collez-le dans votre document."; }
    catch (_) { area.hidden = false; area.value = t; area.focus(); area.select(); $("#copy-msg").textContent = "Sélection prête : copiez avec Ctrl+C (ou Cmd+C)."; }
  };
}

/* ------------------------------------------------ navigation */
let current = "accueil";
try { current = location.hash.slice(1) || "accueil"; } catch (_) {}
function go(h) { current = h; try { history.replaceState(null, "", "#" + h); } catch (_) {} route(); }
document.addEventListener("click", (e) => { const a = e.target.closest('a[href^="#"]'); if (!a) return; e.preventDefault(); go(a.getAttribute("href").slice(1) || "accueil"); });
function route() {
  const h = current || "accueil";
  const v = h.startsWith("l-") || h.startsWith("acte-") ? "accueil" : h;
  $$("#menu a").forEach((a) => a.classList.toggle("on", a.dataset.v === v));
  if (h.startsWith("l-")) vLesson(h.slice(2));
  else if (h === "revision") vReview();
  else if (h === "evaluations") vEval();
  else if (h === "projet") vProject();
  else if (h === "cahier") vBook();
  else { vHome(); if (h.startsWith("acte-")) { meter(); document.getElementById(h)?.scrollIntoView({ block: "start" }); return; } }
  window.scrollTo(0, 0);
  meter();
}
try { route(); } catch (err) { app.innerHTML = "<p>Erreur : " + esc(err && err.message) + "</p>"; }
</script>
