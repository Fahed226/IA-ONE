<title>Signature</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0c0c0e;--bg-2:#111114;--surface:#16161a;--surface-2:#1d1d22;--line:#2a2a31;--line-2:#3a3a43;
  --ink:#ece9e2;--muted:#9b978e;--faint:#6d6a64;
  --brass:#c9a36a;--brass-2:#e2c48f;--wine:#9b3443;--ok:#7fbf9a;--ko:#e0786f;
  --on-brass:#16130d;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;
  --bg:#f2f1ee;--bg-2:#ebe9e4;--surface:#ffffff;--surface-2:#f6f5f2;--line:#dddad3;--line-2:#c9c5bc;
  --ink:#15151a;--muted:#5f5b53;--faint:#8b877e;--brass:#8c6a33;--brass-2:#6f5224;--wine:#8a2a38;--ok:#2f7d55;--ko:#b3402f;--on-brass:#ffffff}}
:root[data-theme="light"]{color-scheme:light;
  --bg:#f2f1ee;--bg-2:#ebe9e4;--surface:#ffffff;--surface-2:#f6f5f2;--line:#dddad3;--line-2:#c9c5bc;
  --ink:#15151a;--muted:#5f5b53;--faint:#8b877e;--brass:#8c6a33;--brass-2:#6f5224;--wine:#8a2a38;--ok:#2f7d55;--ko:#b3402f;--on-brass:#ffffff}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16.5px/1.65 var(--sans);padding-inline:20px;padding-block:0 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.005em}
h4{font-family:var(--sans);font-weight:600;margin:0}
em{font-style:italic}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.muted{color:var(--muted)}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* barre */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-inline:-20px;padding-inline:20px}
.top .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.mark b{font-family:var(--serif);font-size:25px;font-weight:400;letter-spacing:.02em}
.mark span{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.menu{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.menu a{text-decoration:none;font-size:14px;color:var(--muted);padding:7px 12px;border-radius:6px;white-space:nowrap}
.menu a:hover{color:var(--ink)}
.menu a.on{color:var(--ink);background:var(--surface-2)}
.meter{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.meter .bar{width:90px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--brass);width:0;transition:width .4s}

/* accueil */
.hero{padding-block:72px 56px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:56px;align-items:end;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(46px,7.4vw,104px);margin:18px 0 26px}
.hero h1 em{color:var(--brass)}
.hero .lead{font-size:19px;color:var(--muted);max-width:50ch;margin:0 0 32px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:13px 22px;font-weight:500;font-size:15px;text-decoration:none;border:1px solid var(--line-2);background:transparent}
.btn.gold{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.btn.gold:hover{background:var(--brass-2);border-color:var(--brass-2)}
.btn:hover{border-color:var(--brass)}
.facts{border:1px solid var(--line);border-radius:4px;background:var(--bg-2)}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);font-size:14.5px}
.facts div:last-child{border-bottom:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-family:var(--mono);font-size:13.5px;text-align:right}
.manifesto{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;padding-block:64px;border-bottom:1px solid var(--line)}
.manifesto p{font-family:var(--serif);font-size:clamp(24px,3vw,34px);line-height:1.3;margin:0;max-width:30ch}
.manifesto p em{color:var(--brass)}
.outcomes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border-left:1px solid var(--line);margin-top:34px}
.outcomes div{padding:18px 22px;border-right:1px solid var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px;margin-left:-1px}
.outcomes b{display:block;font-family:var(--mono);font-size:11px;color:var(--brass);letter-spacing:.14em;margin-bottom:6px}

.acts{padding-top:64px}
.acts-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.acts-head h2{font-size:clamp(34px,4.5vw,56px)}
.act{display:grid;grid-template-columns:120px minmax(0,1fr);gap:32px;padding-block:36px;border-top:1px solid var(--line);scroll-margin-top:80px}
.act .num{font-family:var(--serif);font-style:italic;font-size:76px;line-height:.9;color:var(--brass)}
.act h3{font-size:clamp(28px,3.4vw,40px);margin:4px 0 8px}
.act .sum{color:var(--muted);max-width:62ch;margin:0 0 20px}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:54px minmax(0,1fr) auto 28px;gap:16px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none;transition:background .2s,padding .2s}
.row:hover{background:var(--bg-2);padding-inline:12px}
.row .k{font-family:var(--mono);font-size:13px;color:var(--faint)}
.row .t{font-size:17px;font-weight:500}
.row .t small{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.row .d{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.check{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:11px}
.done .check{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.row.quiz .t{font-family:var(--serif);font-style:italic;font-size:19px;font-weight:400}

/* leçon */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:64px;padding-top:48px;align-items:start}
.lhead{padding-bottom:30px;border-bottom:1px solid var(--line);margin-bottom:32px}
.lhead h1{font-size:clamp(40px,5.6vw,72px);margin:14px 0 18px}
.lmeta{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.objs{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:10px}
.objs li{display:grid;grid-template-columns:36px minmax(0,1fr);font-size:16px}
.objs li span{font-family:var(--mono);font-size:12px;color:var(--brass);padding-top:3px}
.prose{max-width:68ch}
.prose>*:first-child{margin-top:0}
.prose p,.prose li{font-size:17.5px}
.prose h2{font-size:34px;margin:52px 0 16px;scroll-margin-top:90px}
.prose h3{font-family:var(--sans);font-size:17px;font-weight:600;margin:28px 0 8px}
.prose strong{color:var(--ink);font-weight:600}
.prose ul,.prose ol{padding-left:22px}
.prose li::marker{color:var(--brass)}
.prose table{border-collapse:collapse;width:100%;margin:22px 0;font-size:15px;display:block;overflow-x:auto}
.prose th{text-align:left;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line-2);padding:10px 14px 10px 0}
.prose td{border-bottom:1px solid var(--line);padding:12px 14px 12px 0;vertical-align:top}
.prose blockquote{margin:26px 0;padding:0 0 0 24px;border-left:1px solid var(--brass);font-family:var(--serif);font-size:24px;line-height:1.35;color:var(--ink)}
.prose blockquote p{font-size:inherit;margin:0}
.prose code{font-family:var(--mono);font-size:.85em;color:var(--brass-2)}
.lead-p{font-family:var(--serif);font-size:26px!important;line-height:1.4;color:var(--ink)}
.lead-p p{font-size:inherit!important;margin:0}
.case{margin:36px 0;padding:28px 30px;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.case .eyebrow{display:block;margin-bottom:10px}
.case h3{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 10px}
.keys{margin:20px 0;border-top:1px solid var(--line)}
.keys div{display:grid;grid-template-columns:46px minmax(0,1fr);padding:16px 0;border-bottom:1px solid var(--line);font-size:17px}
.keys b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:24px;color:var(--brass);line-height:1}
.pitfalls{display:grid;gap:8px;margin:14px 0}
.pitfalls div{display:grid;grid-template-columns:24px minmax(0,1fr);font-size:16px;color:var(--muted)}
.pitfalls div::before{content:"—";color:var(--wine)}
.work{margin:40px 0;border:1px solid var(--line-2);border-radius:4px;background:var(--bg-2)}
.work .wh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;padding:22px 26px;border-bottom:1px solid var(--line)}
.work .wh h3{font-size:28px}
.work .wb{padding:22px 26px}
.work textarea{width:100%;min-height:170px;margin-top:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:4px;padding:14px 16px;font:15.5px/1.6 var(--sans);resize:vertical}
.work textarea:focus{border-color:var(--brass);outline:none}
.saved{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:8px;min-height:1.2em}
.sol{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line-2)}
.link{background:none;border:0;padding:0;color:var(--brass);font-weight:500;text-decoration:underline;text-underline-offset:4px}
.refs{display:grid;gap:0;border-top:1px solid var(--line)}
.refs div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.refs i{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.finish{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:48px;padding:26px 0;border-block:1px solid var(--line)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:0}
.pager a{padding:22px 0;text-decoration:none;font-family:var(--serif);font-size:22px;line-height:1.2}
.pager a small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pager a.next{text-align:right;grid-column:2}
.aside{position:sticky;top:92px;display:grid;gap:28px;font-size:14px}
.aside ol{list-style:none;margin:10px 0 0;padding:0;border-left:1px solid var(--line)}
.aside ol a{display:block;padding:6px 0 6px 14px;text-decoration:none;color:var(--muted);margin-left:-1px;border-left:1px solid transparent}
.aside ol a:hover{color:var(--ink);border-left-color:var(--brass)}
.aside ol a.cur{color:var(--ink);border-left-color:var(--brass)}

/* révision */
.page-head{padding-block:56px 30px;border-bottom:1px solid var(--line);margin-bottom:30px;display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.page-head h1{font-size:clamp(40px,5.5vw,68px);margin-top:12px}
.page-head p{margin:10px 0 0;color:var(--muted);max-width:56ch}
.seg{display:flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.flip{perspective:1200px;height:250px;border:0;background:none;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:4px;padding:22px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.flip .f{background:var(--surface);justify-content:space-between}
.flip .f h4{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1}
.flip .f .foot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
.flip .b{background:var(--brass);color:var(--on-brass);transform:rotateY(180deg);font-size:15.5px;overflow:auto;border-color:var(--brass)}
.flip .b ul{margin:0;padding-left:18px}

/* évaluations */
.eval{display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;align-items:start}
.qnav{border-top:1px solid var(--line)}
.qnav button{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 4px;font-size:15px;align-items:center}
.qnav button .n{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--brass)}
.qnav button small{display:block;color:var(--muted);font-size:13px}
.qnav button .s{font-family:var(--mono);font-size:12px;color:var(--muted)}
.qnav button.on{background:var(--bg-2)}
.qbox{border:1px solid var(--line);background:var(--bg-2);border-radius:4px;padding:36px}
.qsteps{display:flex;gap:4px;margin-bottom:30px}
.qsteps i{flex:1;height:2px;background:var(--line-2)}
.qsteps i.ok{background:var(--ok)}.qsteps i.ko{background:var(--ko)}.qsteps i.cur{background:var(--brass)}
.qbox h2{font-size:clamp(26px,3vw,36px);line-height:1.15}
.opts{display:grid;gap:10px;margin-top:26px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:4px;padding:15px 16px;font-size:16px}
.opt .l{font-family:var(--mono);font-size:12px;color:var(--muted);width:26px;height:26px;border:1px solid var(--line-2);border-radius:50%;display:grid;place-items:center}
.opt:hover:not([disabled]){border-color:var(--brass)}
.opt.sel{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.opt.good{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.bad{border-color:var(--ko);box-shadow:inset 0 0 0 1px var(--ko)}
.expl{margin-top:22px;padding-left:18px;border-left:1px solid var(--brass);color:var(--muted);font-size:16px}
.expl b{color:var(--ink)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px;flex-wrap:wrap}
.result{text-align:center;padding:20px 0}
.result .big{font-family:var(--serif);font-size:120px;line-height:1;font-variant-numeric:tabular-nums}
.result .big.ok{color:var(--brass)}

/* cahier + certificat */
.book{display:grid;gap:0;border-top:1px solid var(--line)}
.entry{display:grid;grid-template-columns:70px minmax(0,1fr);gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.entry .k{font-family:var(--serif);font-style:italic;font-size:28px;color:var(--brass);line-height:1}
.entry h4{font-size:16px;margin-bottom:6px}
.entry pre{white-space:pre-wrap;font:15px/1.6 var(--sans);margin:0;color:var(--ink)}
.entry .empty{color:var(--faint);font-style:italic}
.cert{margin-top:56px;border:1px solid var(--brass);padding:10px;border-radius:2px}
.cert .in{border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);padding:clamp(24px,5vw,56px);text-align:center;background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--brass) 12%,transparent),transparent 60%)}
.cert h2{font-size:clamp(34px,5vw,60px);margin:14px 0}
.cert .name{font-family:var(--serif);font-style:italic;font-size:clamp(30px,4.5vw,48px);color:var(--brass);border-bottom:1px solid var(--line-2);display:inline-block;min-width:min(420px,80%);padding:4px 10px;margin:10px 0 18px}
.cert input{background:transparent;border:1px solid var(--line-2);color:var(--ink);border-radius:999px;padding:10px 16px;font:15px var(--sans);width:min(320px,100%)}
.cert .reqs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
.cert .reqs span{font-family:var(--mono);font-size:12px;padding:5px 12px;border:1px solid var(--line-2);border-radius:999px;color:var(--muted)}
.cert .reqs span.ok{border-color:var(--brass);color:var(--brass)}

/* projet */
.cal{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin:10px 0 8px}
.cal i{aspect-ratio:1;display:grid;place-items:center;font-family:var(--mono);font-style:normal;font-size:11px;border:1px solid var(--line);color:var(--muted);border-radius:2px}
.cal i.a{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.cal i.b{background:color-mix(in srgb,var(--brass) 55%,var(--bg));color:var(--ink);border-color:transparent}
.cal i.c{background:color-mix(in srgb,var(--brass) 22%,var(--bg));color:var(--ink);border-color:transparent}
.cal i.d{background:var(--wine);color:#fff;border-color:var(--wine)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:34px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.steps{border-top:1px solid var(--line)}
.steps div{display:grid;grid-template-columns:160px minmax(0,1fr);gap:24px;padding:16px 0;border-bottom:1px solid var(--line)}
.steps b{font-family:var(--mono);font-weight:400;font-size:12.5px;color:var(--brass);padding-top:3px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:56px}
.cols h3{font-size:32px;margin-bottom:16px}
.rub div{padding:14px 0;border-bottom:1px solid var(--line)}
.rub .top2{display:flex;justify-content:space-between;gap:10px}
.rub .top2 b{font-weight:600}
.rub .top2 span{font-family:var(--serif);font-size:24px;color:var(--brass);line-height:1}
.rub p{margin:4px 0 8px;color:var(--muted);font-size:14.5px}
.rub .bar{height:2px;background:var(--line)}
.rub .bar i{display:block;height:100%;background:var(--brass)}
.dl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.dl li{padding:13px 0 13px 28px;border-bottom:1px solid var(--line);position:relative;font-size:15.5px}
.dl li::before{content:"";position:absolute;left:4px;top:21px;width:9px;height:9px;border:1px solid var(--brass);transform:rotate(45deg)}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{cursor:pointer;font-family:var(--serif);font-size:23px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--brass);font-family:var(--sans)}
.faq details[open] summary::after{content:"–"}
.faq summary::-webkit-details-marker{display:none}
.foot{margin-top:80px;padding-top:26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}

@media (max-width:900px){
  .hero,.manifesto,.lesson,.eval,.cols{grid-template-columns:minmax(0,1fr)}

<script>
"use strict";
const C = {"id": "413653a3d1b6", "title": "Personal Branding : de l'invisible à la référence", "subtitle": "Construisez votre marque, faites grandir votre audience et vendez grâce à votre image", "description": "Une formation complète et pratique pour construire une marque personnelle forte : trouver son positionnement, connaître son audience, créer des contenus qui marquent, grandir sur les réseaux sociaux et transformer son image en clients. Chaque leçon se termine par un exercice corrigé, chaque module par un quiz, et la formation par un projet de lancement en 30 jours.", "target_audience": "Entrepreneurs, freelances, indépendants, consultants et créateurs qui veulent se faire connaître et vendre grâce à leur image", "prerequisites": ["Avoir une activité, une expertise ou un projet à faire connaître", "Avoir un compte sur au moins un réseau social", "Aucune compétence technique ou marketing requise"], "learning_outcomes": ["Formuler un positionnement clair et différenciant", "Construire un persona fondé sur les vrais mots de son audience", "Planifier et produire un mois de contenus équilibrés", "Rédiger des accroches et des appels à l'action efficaces", "Optimiser son profil et activer les leviers de croissance", "Analyser ses statistiques et ajuster sa stratégie", "Construire une offre et un parcours qui transforment l'audience en clients"], "skills": ["Positionnement", "Storytelling", "Stratégie éditoriale", "Copywriting", "Croissance sur les réseaux", "Analyse de données", "Vente"], "pedagogical_approach": "Chaque leçon combine explications, exemples réels, points clés et un exercice pratique corrigé. Les exercices s'enchaînent pour construire votre propre marque pas à pas, jusqu'au projet final de 30 jours.", "modules": [{"id": "429969e2fdbb", "title": "Les fondations de sa marque personnelle", "summary": "Comprendre ce qu'est une marque personnelle, trouver son positionnement unique et construire son histoire et son identité.", "objectives": ["Définir sa marque personnelle", "Rédiger son positionnement", "Construire son récit et son identité"], "lessons": [{"id": "d7a7ad811ba7", "plan": {"title": "Ce qu'est (vraiment) une marque personnelle", "summary": "Comprendre ce qu'est une marque personnelle et pourquoi elle devient un actif commercial.", "objectives": ["Définir la marque personnelle avec ses propres mots", "Distinguer réputation, visibilité et marque", "Identifier ce que la marque apporte à son activité"], "duration_minutes": 25, "format": "vidéo + réflexion"}, "content": {"introduction_markdown": "Votre marque personnelle existe déjà : c'est **ce que les gens disent de vous quand vous n'êtes pas dans la pièce**. La question n'est donc pas « faut-il avoir une marque ? » mais « est-ce que je la laisse au hasard ou est-ce que je la construis ? ». Dans cette leçon, on pose les bases qui serviront pendant toute la formation.", "sections": [{"heading": "Une définition simple et utilisable", "content_markdown": "Une marque personnelle, c'est l'association durable entre **votre nom** et **une promesse** dans l'esprit d'un public précis.\n\n> *« Quand je pense à Sarah, je pense à : la personne qui aide les kinés à remplir leur agenda grâce à Instagram. »*\n\nTrois éléments doivent être présents :\n\n| Élément | Question | Exemple |\n|---|---|---|\n| **Pour qui** | Qui doit penser à vous ? | Les kinés installés en libéral |\n| **Quoi** | Pour quel résultat ? | Remplir leur agenda |\n| **Comment** | Avec quelle approche reconnaissable ? | Instagram, sans danser devant la caméra |"}, {"heading": "Visibilité, réputation, marque : trois choses différentes", "content_markdown": "- **La visibilité** : combien de personnes vous voient. On peut être très visible et oublié le lendemain.\n- **La réputation** : ce que les gens pensent de la qualité de votre travail.\n- **La marque** : l'idée claire et unique qu'ils associent à votre nom.\n\nUn compte à 100 000 abonnés sans positionnement clair a de la visibilité mais pas de marque. Une consultante à 3 000 abonnés que tout son secteur recommande a une marque forte. **La marque transforme l'attention en confiance, et la confiance en ventes.**"}, {"heading": "Pourquoi c'est un actif commercial", "content_markdown": "Une marque personnelle bien construite :\n\n1. **Réduit le coût d'acquisition** : les clients viennent à vous au lieu que vous alliez les chercher.\n2. **Permet de vendre plus cher** : on paie plus volontiers une personne identifiée comme la référence.\n3. **Raccourcit le cycle de vente** : le prospect vous connaît déjà avant le premier appel.\n4. **Vous appartient** : contrairement à un poste ou un client, elle vous suit partout.\n\nLes gens achètent à des personnes qu'ils **connaissent, apprécient et en qui ils ont confiance**. Tout le travail de personal branding consiste à faire avancer votre audience sur ces trois marches."}, {"heading": "Authenticité : ni masque, ni journal intime", "content_markdown": "Être authentique ne veut pas dire tout raconter. Pensez à une **version éditée de vous-même** : vraie, mais choisie.\n\n- ✅ Partager vos convictions, vos méthodes, vos coulisses de travail, vos échecs utiles.\n- ❌ Inventer un personnage que vous ne pourrez pas tenir dans la durée.\n- ❌ Exposer votre vie privée sans lien avec la promesse de votre marque.\n\nRègle pratique : **tout contenu personnel doit servir un message professionnel.**"}], "examples": [{"title": "Deux coachs sportifs, deux trajectoires", "content_markdown": "Karim et Julie sont tous deux coachs sportifs. Karim publie des séances variées « pour tout le monde ». Julie publie uniquement sur **la remise en forme des mamans après la grossesse, en 20 minutes à la maison**.\n\nAprès un an, Karim a plus de vues ponctuelles, mais Julie a une liste d'attente : quand une maman cherche une solution, **c'est son nom qui revient**. La spécialisation a créé la marque."}], "key_takeaways": ["Votre marque existe déjà : autant la construire volontairement", "Marque = nom + promesse + public précis", "La visibilité sans positionnement ne crée pas de marque", "Objectif : que votre audience vous connaisse, vous apprécie et vous fasse confiance", "Authentique ne veut pas dire tout montrer"], "exercises": [{"title": "Votre marque aujourd'hui", "instructions_markdown": "1. Envoyez ce message à 5 personnes qui vous connaissent professionnellement : *« En une phrase, pour quoi est-ce que tu me recommanderais ? »*\n2. Notez les réponses mot pour mot.\n3. Comparez-les avec l'image que **vous voulez** donner. Qu'est-ce qui revient ? Qu'est-ce qui manque ?", "difficulty": "facile", "estimated_minutes": 20, "solution_markdown": "Il n'y a pas de bonne réponse unique. Ce qu'il faut observer :\n\n- **Si les réponses sont toutes différentes**, votre marque est floue : le module 1 est prioritaire.\n- **Si elles se ressemblent mais ne correspondent pas à votre cible**, votre marque est claire mais mal orientée : repositionnez-vous (leçon 1.2).\n- **Si elles correspondent à ce que vous voulez**, vous avez une base : il faut maintenant l'amplifier (modules 3 et 4).\n\nGardez ces réponses : vous referez l'exercice à la fin de la formation pour mesurer le chemin parcouru."}], "common_mistakes": ["Confondre nombre d'abonnés et force de marque", "Vouloir plaire à tout le monde", "Copier le style d'un créateur connu au lieu de trouver le sien"], "resources": [{"title": "Montrez votre travail ! — Austin Kleon", "type": "livre", "description": "Court et très concret sur l'art de partager son travail pour se faire connaître."}, {"title": "Influence et manipulation — Robert Cialdini", "type": "livre", "description": "Les principes psychologiques (autorité, sympathie, preuve sociale) qui expliquent pourquoi une marque fait vendre."}], "video_script_markdown": "", "slides": []}}, {"id": "a70129a53ed2", "plan": {"title": "Trouver son positionnement unique", "summary": "Choisir sa niche et formuler une promesse claire qui vous différencie.", "objectives": ["Choisir une niche à l'intersection de ses compétences, de ses envies et d'un marché", "Rédiger sa phrase de positionnement", "Identifier son angle différenciant"], "duration_minutes": 35, "format": "atelier"}, "content": {"introduction_markdown": "Le positionnement est la décision la plus importante de votre marque. Un bon positionnement fait **qu'on vous choisit sans vous comparer**. Un mauvais vous condamne à être « un de plus ». Cette leçon vous fait passer de « je fais du marketing » à une promesse qui se retient.", "sections": [{"heading": "L'intersection gagnante", "content_markdown": "Votre niche se trouve à l'intersection de trois cercles :\n\n1. **Ce que vous savez faire** (compétences, expérience, résultats obtenus)\n2. **Ce que vous aimez faire** (sinon vous ne tiendrez pas 2 ans de contenu)\n3. **Ce pour quoi des gens paient** (un problème urgent et coûteux)\n\nSi un cercle manque : sans compétence, vous perdez en crédibilité ; sans envie, vous abandonnez ; sans marché, vous avez un hobby."}, {"heading": "Niche : assez étroite pour être la référence", "content_markdown": "Se spécialiser fait peur car on a l'impression de perdre des clients. En réalité, **on gagne en mémorisation**.\n\n| Trop large | Mieux | Très bien |\n|---|---|---|\n| Coach business | Coach pour freelances | Coach pour graphistes freelances qui veulent dépasser 5 000 €/mois |\n| Nutritionniste | Nutrition sportive | Nutrition pour coureurs amateurs qui préparent un marathon |\n| Consultant LinkedIn | LinkedIn pour dirigeants | LinkedIn pour dirigeants de PME industrielles qui recrutent |\n\nVous pourrez élargir plus tard. **On se fait connaître par une porte étroite.**"}, {"heading": "La phrase de positionnement", "content_markdown": "Utilisez ce modèle :\n\n> **J'aide** [public précis] **à** [résultat désiré] **grâce à** [méthode / approche] **sans** [la contrainte qu'ils redoutent].\n\nExemples :\n- *J'aide les artisans du bâtiment à trouver des chantiers grâce à Facebook, sans y passer plus de 2 heures par semaine.*\n- *J'aide les jeunes diplômés en finance à décrocher leur premier CDI grâce à un LinkedIn qui attire les recruteurs, sans envoyer 200 candidatures.*\n\nCette phrase deviendra votre bio, votre accroche en réseau et le fil rouge de vos contenus."}, {"heading": "Trouver son angle différenciant", "content_markdown": "Dans une niche, d'autres existent déjà. Votre angle, c'est **ce qui vous rend reconnaissable**. Pistes :\n\n- **Votre parcours** : « ancien recruteur passé de l'autre côté », « infirmière devenue développeuse ».\n- **Votre méthode** : un nom, des étapes, un cadre propriétaire (ex. *la méthode 3P*).\n- **Votre conviction** : une idée forte, parfois à contre-courant (*« Arrêtez de poster tous les jours »*).\n- **Votre ton** : humour, franc-parler, pédagogie ultra-simple, esthétique.\n\nUn bon angle se résume en une expression que votre audience peut répéter."}], "examples": [{"title": "De « graphiste » à référence", "content_markdown": "Léa se présentait comme « graphiste freelance ». Elle a combiné son expérience passée en restauration et son métier : **« Je crée l'identité visuelle des restaurants qui veulent remplir leur salle grâce à Instagram. »** Elle parle désormais le langage des restaurateurs, montre des cas concrets de restaurants, et ses clients se la recommandent entre eux."}, {"title": "Une conviction comme angle", "content_markdown": "Un conseiller en investissement se démarque avec une conviction répétée dans tous ses contenus : *« La meilleure stratégie est ennuyeuse. »* Face à un secteur plein de promesses spectaculaires, cette phrase devient sa signature."}], "key_takeaways": ["Niche = compétences ∩ envie ∩ marché qui paie", "Une niche étroite rend mémorable ; on élargit plus tard", "Phrase clé : J'aide [qui] à [résultat] grâce à [méthode] sans [contrainte]", "L'angle différenciant peut venir du parcours, de la méthode, d'une conviction ou du ton"], "exercises": [{"title": "Rédiger votre positionnement", "instructions_markdown": "1. Listez 5 compétences, 5 sujets qui vous passionnent et 5 problèmes pour lesquels des gens paient autour de vous.\n2. Entourez les combinaisons qui apparaissent dans les trois listes.\n3. Rédigez **3 versions** de votre phrase de positionnement avec le modèle *J'aide… à… grâce à… sans…*.\n4. Choisissez-en une et testez-la sur 3 personnes de votre cible : comprennent-elles en moins de 5 secondes ?", "difficulty": "moyen", "estimated_minutes": 40, "solution_markdown": "**Exemple corrigé** (profil : ancienne commerciale, passionnée de psychologie, à l'aise sur LinkedIn) :\n\n- Version 1 : *J'aide les entreprises à mieux vendre.* → trop large, aucune différenciation.\n- Version 2 : *J'aide les commerciaux B2B à mieux prospecter grâce à LinkedIn.* → mieux, mais encore banal.\n- Version 3 : *J'aide les commerciaux B2B à décrocher des rendez-vous sur LinkedIn grâce à la psychologie de la persuasion, sans messages automatiques qui font fuir.* → public précis, résultat concret, méthode distinctive, objection traitée.\n\n**Critères de validation** : un inconnu de la cible doit pouvoir répondre à « c'est pour moi ? » en moins de 5 secondes, et vous devez pouvoir produire au moins 50 idées de contenus sur ce positionnement."}], "common_mistakes": ["Choisir une niche uniquement parce qu'elle « marche » chez les autres", "Rédiger une promesse vague (« réussir », « s'épanouir »)", "Changer de positionnement tous les mois"], "resources": [{"title": "Building a StoryBrand — Donald Miller", "type": "livre", "description": "Méthode pour clarifier son message en plaçant le client au centre de l'histoire."}, {"title": "Positioning — Al Ries et Jack Trout", "type": "livre", "description": "Le classique sur la bataille pour une place dans l'esprit du public."}], "video_script_markdown": "", "slides": []}}, {"id": "bc75fd95294d", "plan": {"title": "Son histoire et son identité de marque", "summary": "Construire son récit, ses valeurs et une identité visuelle et verbale cohérente.", "objectives": ["Structurer son histoire personnelle en récit de marque", "Définir 3 valeurs et un ton de voix", "Créer une identité visuelle simple et cohérente"], "duration_minutes": 30, "format": "atelier"}, "content": {"introduction_markdown": "Les faits informent, les histoires font retenir. Votre histoire donne une raison de vous suivre **vous** plutôt qu'un autre expert aussi compétent. Associée à une identité cohérente (valeurs, ton, visuels), elle rend votre marque reconnaissable en un coup d'œil.", "sections": [{"heading": "Le récit de marque en 5 temps", "content_markdown": "1. **Avant** : d'où vous partez (situation que votre audience vit aujourd'hui).\n2. **Le déclic** : l'événement, l'échec ou la rencontre qui a tout changé.\n3. **Le chemin** : ce que vous avez essayé, appris, construit.\n4. **Le résultat** : où vous en êtes aujourd'hui, preuves à l'appui.\n5. **La mission** : pourquoi vous aidez maintenant les autres à faire ce chemin.\n\nL'objectif n'est pas de vous mettre en valeur, mais de permettre à votre audience de **se reconnaître dans votre « avant »** et de désirer votre « après »."}, {"heading": "Valeurs et ton de voix", "content_markdown": "Choisissez **3 valeurs** qui guideront vos contenus et vos décisions (ex. : franchise, simplicité, exigence). Pour chacune, définissez ce qu'elle implique concrètement.\n\nPuis décrivez votre ton avec des paires « plutôt / plutôt pas » :\n\n| Plutôt | Plutôt pas |\n|---|---|\n| Direct | Agressif |\n| Pédagogue | Professoral |\n| Chaleureux | Familier |\n| Expert | Jargonneux |\n\nCe tableau vous servira aussi si vous déléguez un jour la rédaction."}, {"heading": "Identité visuelle minimale", "content_markdown": "Pas besoin d'un logo à 3 000 € pour démarrer. Il faut surtout de la **cohérence** :\n\n- **Une photo de profil** professionnelle : visage net, lumière naturelle, fond simple, regard caméra, la même partout.\n- **2 à 3 couleurs** et **1 à 2 polices** utilisées dans tous vos visuels.\n- **Des modèles réutilisables** (Canva ou équivalent) pour vos carrousels, citations et miniatures.\n- **Une bannière** (LinkedIn, YouTube, X) qui reprend votre phrase de positionnement.\n\nTest : si l'on cache votre nom, votre audience reconnaît-elle vos visuels dans son fil ?"}], "examples": [{"title": "L'histoire qui a lancé une marque", "content_markdown": "Thomas, comptable, raconte : *« Pendant 8 ans, j'ai vu des indépendants brillants couler à cause de leur trésorerie, pas de leur talent. »* Il partage ensuite comment il a construit un tableau de suivi simple, puis son intention : que plus aucun freelance ne découvre un redressement de TVA par surprise. Son récit crée une connexion immédiate avec des indépendants qui ont peur de l'administratif."}], "key_takeaways": ["L'histoire permet à l'audience de se reconnaître dans votre « avant »", "Structure : avant, déclic, chemin, résultat, mission", "3 valeurs + un ton de voix défini par des « plutôt / plutôt pas »", "Cohérence visuelle : même photo, mêmes couleurs, mêmes modèles partout"], "exercises": [{"title": "Écrire votre histoire de marque", "instructions_markdown": "Rédigez votre récit en 5 paragraphes courts (avant, déclic, chemin, résultat, mission), 200 à 300 mots maximum. Puis rédigez votre tableau de ton de voix (4 lignes « plutôt / plutôt pas »).", "difficulty": "moyen", "estimated_minutes": 35, "solution_markdown": "**Points de contrôle** :\n\n- Le paragraphe « avant » décrit une situation que **votre cible vit aujourd'hui** (et non un détail biographique sans lien).\n- Le déclic est **concret** : une date, une scène, un chiffre, une phrase entendue.\n- Le résultat contient **au moins une preuve** (chiffre, client, réalisation).\n- La mission parle **de l'audience**, pas de vous.\n\nCe texte sera réutilisé : section « À propos » de LinkedIn, page de vente, premier post épinglé, présentation orale en 60 secondes."}], "common_mistakes": ["Raconter sa vie sans lien avec le problème de l'audience", "Changer de couleurs et de style de visuels à chaque publication", "Utiliser une photo de profil différente sur chaque réseau"], "resources": [{"title": "Canva", "type": "outil", "description": "Création de modèles visuels cohérents (carrousels, bannières, miniatures)."}, {"title": "Coolors", "type": "outil", "description": "Générateur de palettes de couleurs pour définir sa charte."}], "video_script_markdown": "", "slides": []}}], "quiz": {"title": "Quiz — Les fondations de sa marque", "instructions": "Choisissez la ou les bonnes réponses, puis validez pour voir les explications.", "passing_score_percent": 70, "questions": [{"question": "Quelle définition correspond le mieux à une marque personnelle ?", "type": "choix_unique", "options": ["Le nombre d'abonnés sur ses réseaux", "L'association durable entre un nom, une promesse et un public précis", "Un logo et une charte graphique", "Le fait de publier tous les jours"], "correct_indexes": [1], "explanation": "La marque est une idée claire dans l'esprit d'un public. Abonnés et logo n'en sont que des outils ou des conséquences.", "bloom_level": "comprendre"}, {"question": "Un compte à 100 000 abonnés a forcément une marque personnelle forte.", "type": "vrai_faux", "options": ["Vrai", "Faux"], "correct_indexes": [1], "explanation": "Visibilité n'est pas marque : sans positionnement clair, le public ne retient rien de précis.", "bloom_level": "comprendre"}, {"question": "Laquelle de ces phrases de positionnement est la plus efficace ?", "type": "choix_unique", "options": ["J'aide les gens à réussir", "Coach business passionnée", "J'aide les graphistes freelances à dépasser 5 000 €/mois grâce à LinkedIn, sans prospection à froid", "Experte en marketing digital et réseaux sociaux"], "correct_indexes": [2], "explanation": "Elle précise le public, le résultat, la méthode et l'objection traitée.", "bloom_level": "évaluer"}, {"question": "Quelles sources peuvent constituer un angle différenciant ?", "type": "choix_multiple", "options": ["Votre parcours", "Votre méthode propriétaire", "Une conviction forte", "Copier le ton du créateur le plus suivi de la niche"], "correct_indexes": [0, 1, 2], "explanation": "Parcours, méthode, conviction et ton personnel différencient. Copier un autre créateur fait de vous une copie.", "bloom_level": "analyser"}, {"question": "Dans le récit de marque, à quoi sert l'étape « avant » ?", "type": "choix_unique", "options": ["À raconter son enfance en détail", "À permettre à l'audience de se reconnaître dans votre situation passée", "À lister ses diplômes", "À présenter son offre"], "correct_indexes": [1], "explanation": "L'« avant » crée l'identification : le lecteur se dit « c'est moi aujourd'hui ».", "bloom_level": "comprendre"}]}}, {"id": "e5348ef77a9f", "title": "Connaître son audience", "summary": "Construire son persona, récolter les vrais mots de sa cible et choisir les bonnes plateformes.", "objectives": ["Construire un persona fondé sur des faits", "Collecter des verbatims", "Choisir ses réseaux"], "lessons": [{"id": "511e2e7b813e", "plan": {"title": "Construire son persona", "summary": "Décrire précisément la personne idéale que vos contenus doivent attirer.", "objectives": ["Construire un persona détaillé et réaliste", "Identifier les douleurs, désirs et objections de sa cible", "Utiliser le persona pour choisir ses sujets"], "duration_minutes": 30, "format": "atelier"}, "content": {"introduction_markdown": "On ne crée pas du contenu « pour les réseaux », on le crée **pour une personne**. Plus vous la connaissez, plus vos contenus donnent l'impression de lire dans ses pensées. C'est ce sentiment qui fait s'abonner, commenter et acheter.", "sections": [{"heading": "Les 6 blocs d'un persona utile", "content_markdown": "| Bloc | Questions |\n|---|---|\n| **Situation** | Âge, métier, contexte de vie et de travail |\n| **Douleurs** | Qu'est-ce qui l'empêche de dormir ? Qu'est-ce qui lui coûte du temps ou de l'argent ? |\n| **Désirs** | À quoi ressemble sa vie idéale dans 12 mois ? |\n| **Objections** | Pourquoi n'a-t-elle pas encore résolu le problème ? (prix, temps, doute, mauvaise expérience) |\n| **Habitudes** | Quels réseaux, à quel moment, quels comptes suit-elle ? |\n| **Vocabulaire** | Avec quels mots exacts décrit-elle son problème ? |\n\nLe dernier bloc est le plus sous-estimé : **utiliser les mots de votre audience** rend vos accroches immédiatement pertinentes."}, {"heading": "Du persona aux sujets de contenu", "content_markdown": "Chaque bloc devient une source de contenus :\n\n- **Douleurs** → contenus qui nomment le problème (*« Vous publiez tous les jours et personne ne réagit ? »*).\n- **Désirs** → contenus d'inspiration et de résultats clients.\n- **Objections** → contenus qui déconstruisent les croyances (*« Non, il ne faut pas 10 000 abonnés pour vendre »*).\n- **Vocabulaire** → titres et accroches."}, {"heading": "Un persona vivant, pas une fiche oubliée", "content_markdown": "Donnez-lui un prénom et une photo, affichez-le près de votre écran. Avant chaque publication, demandez-vous : **« Est-ce que [prénom] s'arrêterait sur ce contenu ? »** Mettez-le à jour tous les trimestres avec ce que vous apprenez en échangeant avec votre audience."}], "examples": [{"title": "Persona : « Claire, 38 ans »", "content_markdown": "*Claire, 38 ans, responsable RH dans une PME de 80 salariés. Elle recrute seule, manque de temps, et voit ses offres ignorées sur les jobboards. **Douleur** : « Je passe mes soirées à trier des CV qui ne correspondent pas. » **Désir** : attirer des candidats qui viennent d'eux-mêmes. **Objection** : « LinkedIn, c'est pour les grandes entreprises avec un budget marque employeur. » **Habitudes** : LinkedIn le matin dans les transports. **Vocabulaire** : « galère de recrutement », « candidats fantômes ».*\n\nUn consultant qui cible Claire publiera : *« Candidats fantômes : 3 raisons pour lesquelles vos offres n'attirent personne (et ce n'est pas le salaire). »*"}], "key_takeaways": ["On crée pour une personne, pas pour « tout le monde »", "Persona = situation, douleurs, désirs, objections, habitudes, vocabulaire", "Les mots exacts de l'audience font les meilleures accroches", "Chaque bloc du persona est une source de sujets"], "exercises": [{"title": "Votre persona en une page", "instructions_markdown": "Remplissez les 6 blocs pour votre client idéal. Donnez-lui un prénom. Puis déduisez-en **10 idées de contenus** : 3 sur ses douleurs, 3 sur ses désirs, 4 sur ses objections.", "difficulty": "moyen", "estimated_minutes": 30, "solution_markdown": "**Grille d'autocorrection** :\n\n- Les douleurs sont **concrètes et vécues** (« je trie des CV le soir ») et pas abstraites (« manque d'efficacité »).\n- Au moins 3 expressions du bloc vocabulaire viennent de **vraies conversations** ou de commentaires lus, pas de votre imagination.\n- Chaque idée de contenu pourrait commencer par une phrase que votre persona dirait elle-même.\n\nSi vous bloquez sur le vocabulaire, passez directement à la leçon 2.2 : elle vous donne les méthodes pour le récolter."}], "common_mistakes": ["Créer un persona trop large (« les entrepreneurs de 25 à 55 ans »)", "Inventer les douleurs au lieu de les vérifier", "Parler avec son jargon d'expert au lieu des mots de l'audience"], "resources": [{"title": "Méthode Jobs To Be Done — Clayton Christensen (« Competing Against Luck »)", "type": "livre", "description": "Comprendre le « travail » pour lequel un client « embauche » un produit."}], "video_script_markdown": "", "slides": []}}, {"id": "b0352b14158b", "plan": {"title": "Écouter et étudier son audience", "summary": "Récolter les vrais problèmes et les vrais mots de sa cible, gratuitement.", "objectives": ["Mener des entretiens d'audience efficaces", "Exploiter commentaires, groupes et outils de recherche", "Organiser ses découvertes dans une banque d'idées"], "duration_minutes": 30, "format": "atelier + outils"}, "content": {"introduction_markdown": "Les meilleurs créateurs ne sont pas ceux qui ont le plus d'idées, mais ceux qui **écoutent le mieux**. Votre audience vous dit chaque jour ce qu'elle veut lire et acheter : il suffit de savoir où regarder.", "sections": [{"heading": "Les entretiens : la méthode la plus puissante", "content_markdown": "Proposez 20 minutes d'échange à 5 à 10 personnes de votre cible. Posez des questions sur **leur passé réel**, pas sur des intentions :\n\n1. *« Raconte-moi la dernière fois que tu as rencontré [problème]. »*\n2. *« Qu'as-tu essayé ? Qu'est-ce qui n'a pas marché ? »*\n3. *« Qu'est-ce qui serait différent si c'était réglé ? »*\n4. *« Où cherches-tu des conseils sur ce sujet ? »*\n\nÉvitez : *« Est-ce que tu achèterais… ? »* Les gens répondent oui par politesse. Notez **les phrases exactes** : ce seront vos futures accroches."}, {"heading": "Les mines d'or en ligne", "content_markdown": "- **Commentaires** des comptes influents de votre niche : les questions qui reviennent sont des sujets de contenus.\n- **Groupes** Facebook, LinkedIn, Reddit, Discord : lisez les messages « J'ai besoin d'aide ».\n- **Avis clients** 1 à 3 étoiles de livres ou formations concurrentes : ils révèlent les attentes déçues.\n- **Suggestions de recherche** : Google, YouTube et TikTok complètent automatiquement les recherches fréquentes.\n- **Outils** : Google Trends (tendances), AnswerThePublic (questions posées)."}, {"heading": "Votre banque d'idées", "content_markdown": "Centralisez tout dans un seul outil (Notion, Google Sheets, application de notes) avec 4 colonnes :\n\n| Verbatim | Source | Type (douleur / désir / objection) | Idée de contenu |\n|---|---|---|---|\n| « Je n'ose pas me montrer en vidéo » | Entretien Marie | Objection | 5 formats pour percer sans montrer son visage |\n\nObjectif : ne plus jamais vous demander « sur quoi je publie aujourd'hui ? »."}], "examples": [{"title": "20 minutes qui changent une offre", "content_markdown": "Une coach en organisation pensait que sa cible voulait « être plus productive ». En entretien, cinq mères entrepreneures ont toutes employé la même expression : **« J'ai l'impression de courir toute la journée et de ne rien avancer. »** Elle a réécrit sa bio et ses accroches avec cette phrase : ses messages privés ont nettement augmenté, car les lectrices se sont reconnues."}], "key_takeaways": ["Les entretiens sur des situations passées valent mieux que les sondages", "Commentaires, groupes et avis négatifs sont des sources gratuites de sujets", "Notez les verbatims exacts", "Une banque d'idées supprime la panne d'inspiration"], "exercises": [{"title": "Mission écoute", "instructions_markdown": "En une semaine : réalisez **3 entretiens** avec des personnes de votre cible et collectez **20 verbatims** en ligne (commentaires, groupes, avis). Rangez-les dans votre banque d'idées et transformez les 5 meilleurs en titres de contenus.", "difficulty": "moyen", "estimated_minutes": 120, "solution_markdown": "**Exemple de transformation verbatim → titre** :\n\n- « Je poste mais j'ai zéro commentaire » → *Zéro commentaire sur vos posts ? Le problème vient probablement de votre dernière ligne.*\n- « Je ne sais pas quoi raconter » → *47 idées de posts quand on pense n'avoir rien à dire.*\n- « Les gens trouvent ça trop cher » → *Si on vous dit « c'est trop cher », ce n'est (presque) jamais le prix.*\n\nUn bon titre reprend **les mots de l'audience** et promet une **réponse précise**."}], "common_mistakes": ["Demander « est-ce que vous achèteriez ? » en entretien", "Ne consulter que les comptes à succès et jamais les commentaires", "Garder ses idées dans sa tête ou éparpillées"], "resources": [{"title": "Google Trends", "type": "outil", "description": "Visualiser l'évolution de l'intérêt pour un sujet."}, {"title": "AnswerThePublic", "type": "outil", "description": "Lister les questions que les internautes posent autour d'un mot-clé."}, {"title": "The Mom Test — Rob Fitzpatrick", "type": "livre", "description": "Comment interroger ses clients sans qu'ils vous mentent par politesse."}], "video_script_markdown": "", "slides": []}}, {"id": "5fe1c346911d", "plan": {"title": "Choisir ses plateformes", "summary": "Sélectionner 1 réseau principal et 1 secondaire en fonction de son audience et de ses forces.", "objectives": ["Comparer les principaux réseaux sociaux", "Choisir un réseau principal et un secondaire", "Définir un rythme de publication tenable"], "duration_minutes": 25, "format": "texte + tableau comparatif"}, "content": {"introduction_markdown": "Être partout, c'est souvent n'être bon nulle part. Mieux vaut **dominer un réseau** que survivre sur cinq. Cette leçon vous aide à choisir où concentrer votre énergie.", "sections": [{"heading": "Panorama des plateformes", "content_markdown": "| Plateforme | Forces | Idéal pour |\n|---|---|---|\n| **LinkedIn** | Audience professionnelle, forte portée des posts texte et carrousels | B2B, consultants, recrutement, services aux entreprises |\n| **Instagram** | Visuel, Reels, stories pour la proximité | Lifestyle, bien-être, mode, food, créateurs, B2C |\n| **TikTok** | Découverte massive par l'algorithme, vidéos courtes | Croissance rapide, audiences jeunes et grand public |\n| **YouTube** | Contenu long, recherché, durable (effet moteur de recherche) | Expertise, tutoriels, confiance profonde |\n| **X (Twitter)** | Idées, actualité, conversations | Tech, finance, médias, réflexion |\n| **Newsletter** | Canal que vous possédez, relation directe | Tout le monde, en complément |\n\nLes algorithmes et usages évoluent vite : vérifiez régulièrement où se trouve réellement votre audience."}, {"heading": "La règle 1 + 1 (+ 1)", "content_markdown": "- **1 réseau principal** : là où se trouve votre persona et où votre format naturel (écrit, vidéo, image) est roi. 80 % de votre énergie.\n- **1 réseau secondaire** : où vous recyclez vos contenus. 20 %.\n- **+ 1 canal possédé** : newsletter ou liste e-mail. Vos abonnés sur un réseau peuvent disparaître si l'algorithme change ; votre liste e-mail vous appartient."}, {"heading": "Un rythme tenable", "content_markdown": "La régularité bat l'intensité. Mieux vaut **3 publications par semaine pendant 12 mois** que 2 par jour pendant 3 semaines.\n\nPoint de départ conseillé :\n- LinkedIn : 3 posts / semaine\n- Instagram : 3 à 4 publications + stories quasi quotidiennes\n- TikTok : 3 à 5 vidéos / semaine\n- YouTube : 1 vidéo / semaine ou toutes les 2 semaines\n- Newsletter : 1 / semaine ou 1 / 15 jours"}], "examples": [{"title": "Choix raisonné", "content_markdown": "Une avocate en droit du travail qui cible les dirigeants de PME choisit **LinkedIn** en principal (ses clients y sont, elle écrit bien), **YouTube** en secondaire (des vidéos « Peut-on licencier pour… ? » très recherchées) et une **newsletter mensuelle** « L'actu sociale en 5 minutes »."}], "key_takeaways": ["Mieux vaut dominer un réseau que survivre sur cinq", "Réseau principal = présence du persona + votre format naturel", "Construisez en parallèle un canal possédé (e-mail)", "Régularité > intensité"], "exercises": [{"title": "Votre plan de présence", "instructions_markdown": "Choisissez votre réseau principal, votre réseau secondaire et votre canal possédé. Justifiez chaque choix en 2 phrases (audience + format) et fixez un rythme hebdomadaire que vous êtes **sûr** de tenir pendant 3 mois.", "difficulty": "facile", "estimated_minutes": 15, "solution_markdown": "**Contrôle** : votre choix est bon si (1) vous pouvez citer au moins 5 comptes suivis par votre persona sur ce réseau, (2) le format dominant du réseau correspond à celui où vous êtes le plus à l'aise ou prêt à progresser, (3) le rythme choisi représente moins de 5 heures par semaine au départ. Si un de ces points manque, revoyez le choix plutôt que de vous épuiser."}], "common_mistakes": ["Ouvrir 5 comptes en même temps", "Choisir un réseau parce qu'il est à la mode et non parce que la cible y est", "Négliger la liste e-mail"], "resources": [{"title": "Substack / Brevo / Kit", "type": "outil", "description": "Plateformes pour démarrer une newsletter gratuitement."}], "video_script_markdown": "", "slides": []}}], "quiz": {"title": "Quiz — Connaître son audience", "instructions": "Choisissez la ou les bonnes réponses, puis validez pour voir les explications.", "passing_score_percent": 70, "questions": [{"question": "Pourquoi noter les mots exacts de son audience ?", "type": "choix_unique", "options": ["Pour les citer dans ses mentions légales", "Parce qu'ils rendent les accroches immédiatement parlantes pour la cible", "Pour améliorer son orthographe", "Ce n'est pas utile"], "correct_indexes": [1], "explanation": "Utiliser le vocabulaire de la cible lui donne l'impression que vous lisez dans ses pensées.", "bloom_level": "comprendre"}, {"question": "En entretien, quelle question est la plus fiable ?", "type": "choix_unique", "options": ["Est-ce que tu achèterais ma formation ?", "Raconte-moi la dernière fois que tu as rencontré ce problème.", "Tu trouves mon idée bonne ?", "Combien tu serais prêt à payer ?"], "correct_indexes": [1], "explanation": "Les questions sur des faits passés réels donnent des réponses fiables ; les questions hypothétiques entraînent des réponses polies.", "bloom_level": "appliquer"}, {"question": "Quelles sont de bonnes sources pour découvrir les problèmes de votre audience ?", "type": "choix_multiple", "options": ["Les commentaires des comptes influents de la niche", "Les avis négatifs sur des produits concurrents", "Les groupes et forums de la niche", "Vos seules intuitions"], "correct_indexes": [0, 1, 2], "explanation": "Les intuitions doivent être vérifiées ; les trois autres sources donnent des verbatims réels.", "bloom_level": "analyser"}, {"question": "Il est recommandé de démarrer sur 5 réseaux sociaux en même temps pour maximiser ses chances.", "type": "vrai_faux", "options": ["Vrai", "Faux"], "correct_indexes": [1], "explanation": "Mieux vaut un réseau principal, un secondaire et un canal possédé (e-mail).", "bloom_level": "comprendre"}, {"question": "Pourquoi construire une liste e-mail en parallèle des réseaux ?", "type": "choix_unique", "options": ["Parce que les e-mails sont gratuits à envoyer", "Parce que c'est une audience que vous possédez, indépendante des algorithmes", "Parce que c'est obligatoire légalement", "Pour remplacer totalement les réseaux"], "correct_indexes": [1], "explanation": "Vos abonnés sur un réseau dépendent de la plateforme ; votre liste vous appartient.", "bloom_level": "comprendre"}]}}, {"id": "bdd72bb23c90", "title": "Créer du contenu qui marque", "summary": "Définir sa ligne éditoriale, écrire des contenus qui retiennent et produire efficacement.", "objectives": ["Construire un calendrier éditorial équilibré", "Rédiger accroches et CTA", "Mettre en place un système de production"], "lessons": [{"id": "4fc86ae39988", "plan": {"title": "Ses piliers de contenu et la stratégie éditoriale", "summary": "Définir 3 à 4 thématiques récurrentes et équilibrer les objectifs de ses contenus.", "objectives": ["Définir ses piliers de contenu", "Équilibrer contenus de visibilité, de confiance et de conversion", "Construire un calendrier éditorial"], "duration_minutes": 30, "format": "atelier"}, "content": {"introduction_markdown": "Sans stratégie éditoriale, on publie au gré de l'humeur et l'audience ne comprend pas pourquoi vous suivre. Les **piliers de contenu** donnent une colonne vertébrale à votre marque.", "sections": [{"heading": "Définir 3 à 4 piliers", "content_markdown": "Un pilier est une **thématique récurrente** liée à votre positionnement. Exemple pour une coach LinkedIn pour dirigeants :\n\n1. **Écrire sur LinkedIn** (méthodes, structures de posts)\n2. **Leadership visible** (pourquoi et comment un dirigeant prend la parole)\n3. **Coulisses et résultats** (accompagnements, avant / après)\n4. **Convictions** (prises de position sur le secteur)\n\nChaque idée de votre banque d'idées doit pouvoir se ranger dans un pilier."}, {"heading": "Les 3 objectifs d'un contenu", "content_markdown": "| Objectif | Rôle | Exemples | Part conseillée |\n|---|---|---|---|\n| **Attirer** (visibilité) | Toucher de nouvelles personnes | Contenus larges, tendances, opinions fortes, listes | ~40 % |\n| **Nourrir** (confiance) | Prouver votre expertise, créer du lien | Tutoriels, méthodes, histoires, coulisses | ~40 % |\n| **Convertir** (vente) | Transformer en clients | Études de cas, témoignages, offres, appels à l'action | ~20 % |\n\nBeaucoup de créateurs ne font qu'attirer (beaucoup de vues, zéro vente) ou que vendre (audience qui se lasse)."}, {"heading": "Le calendrier éditorial", "content_markdown": "Sur un tableau simple, planifiez 4 semaines à l'avance :\n\n| Jour | Pilier | Objectif | Format | Sujet |\n|---|---|---|---|---|\n| Lundi | Méthode | Nourrir | Carrousel | 5 structures de posts qui marchent |\n| Mercredi | Conviction | Attirer | Texte | Pourquoi « poster tous les jours » est un mauvais conseil |\n| Vendredi | Résultats | Convertir | Étude de cas | Comment Marc a signé 3 clients en 2 mois |\n\nVous pouvez ainsi ajuster l'équilibre d'un coup d'œil."}], "examples": [{"title": "Un mois équilibré", "content_markdown": "Une nutritionniste publie 12 contenus par mois : 5 pour attirer (*« 3 aliments « healthy » qui ne le sont pas »*), 5 pour nourrir (*recette express, explication de la satiété*), 2 pour convertir (*témoignage d'une cliente + ouverture des places de son programme*). Son audience grandit **et** ses places se remplissent."}], "key_takeaways": ["3 à 4 piliers donnent une ligne éditoriale claire", "Chaque contenu a un objectif : attirer, nourrir ou convertir", "Repère : ~40 / 40 / 20", "Planifiez 4 semaines à l'avance"], "exercises": [{"title": "Votre calendrier du mois", "instructions_markdown": "Définissez vos 3 ou 4 piliers, puis remplissez un calendrier de 12 contenus sur 4 semaines en respectant l'équilibre attirer / nourrir / convertir.", "difficulty": "moyen", "estimated_minutes": 45, "solution_markdown": "**Vérification** :\n\n- Chaque pilier apparaît au moins 2 fois dans le mois.\n- Vous avez 4 à 5 contenus « attirer », 4 à 5 « nourrir » et 2 à 3 « convertir ».\n- Les contenus « convertir » arrivent **après** des contenus « nourrir » sur le même thème (on prouve avant de vendre).\n- Au moins 3 sujets viennent directement de votre banque de verbatims (leçon 2.2)."}], "common_mistakes": ["Ne publier que des contenus de visibilité sans jamais proposer son offre", "Avoir 10 piliers (plus de ligne claire)", "Planifier au jour le jour"], "resources": [{"title": "Notion", "type": "outil", "description": "Base de données pour gérer banque d'idées et calendrier éditorial."}, {"title": "Trello", "type": "outil", "description": "Tableau visuel idée → rédaction → programmé → publié."}], "video_script_markdown": "", "slides": []}}, {"id": "fed7c84b154f", "plan": {"title": "Écrire des accroches et des contenus qui retiennent", "summary": "Maîtriser les accroches, les structures de contenus et les appels à l'action.", "objectives": ["Rédiger des accroches qui arrêtent le défilement", "Structurer un contenu avec des modèles éprouvés", "Terminer par un appel à l'action adapté"], "duration_minutes": 40, "format": "atelier d'écriture"}, "content": {"introduction_markdown": "Sur les réseaux, vous avez **quelques secondes** pour convaincre quelqu'un d'arrêter de faire défiler. L'accroche décide si votre contenu sera lu ; la structure décide s'il sera retenu ; l'appel à l'action décide s'il sera utile à votre marque.", "sections": [{"heading": "7 types d'accroches", "content_markdown": "| Type | Exemple |\n|---|---|\n| **Chiffre précis** | « J'ai analysé 100 profils LinkedIn de freelances. 83 font la même erreur. » |\n| **Contre-intuitif** | « Arrêtez de publier tous les jours. » |\n| **Question qui pique** | « Pourquoi vos concurrents moins bons que vous signent plus de clients ? » |\n| **Histoire** | « Il y a 2 ans, j'ai perdu mon plus gros client en une phrase. » |\n| **Promesse** | « La méthode en 3 étapes pour écrire un post en 20 minutes. » |\n| **Avant / après** | « De 0 à 5 rendez-vous par mois sans prospection à froid. » |\n| **Identification** | « Si vous avez déjà réécrit un post 6 fois avant de le supprimer, lisez ceci. » |\n\nRègle : la première ligne doit donner envie de lire la deuxième, et ainsi de suite."}, {"heading": "3 structures qui fonctionnent", "content_markdown": "**PAS (Problème – Agitation – Solution)**\n1. Nommer le problème. 2. Montrer ce qu'il coûte. 3. Apporter la solution.\n\n**L'histoire en 4 temps**\n1. Situation. 2. Obstacle. 3. Tournant. 4. Leçon pour le lecteur.\n\n**La liste actionnable**\n1. Promesse. 2. 3 à 7 points concrets, un par ligne. 3. Synthèse + question.\n\nMise en forme : phrases courtes, une idée par ligne, beaucoup d'espace, pas de pavé."}, {"heading": "L'appel à l'action (CTA)", "content_markdown": "Chaque contenu se termine par **une seule** action demandée, adaptée à son objectif :\n\n- **Attirer** → *« Quelle est la pire accroche que vous ayez lue ? »* (commentaires)\n- **Nourrir** → *« Enregistrez ce post pour votre prochaine rédaction. »* (sauvegardes)\n- **Convertir** → *« Écrivez-moi « AUDIT » en message privé pour recevoir l'analyse de votre profil. »*\n\nUn CTA flou (« N'hésitez pas à me suivre ») est rarement suivi d'effet."}, {"heading": "La valeur avant tout", "content_markdown": "Une accroche forte sur un contenu creux abîme votre marque. Test avant publication : **le lecteur apprend-il quelque chose, se sent-il compris, ou a-t-il envie d'agir ?** Si aucune des trois, retravaillez."}], "examples": [{"title": "Post LinkedIn réécrit", "content_markdown": "**Avant** : *« Aujourd'hui je voulais vous parler de l'importance de la photo de profil sur LinkedIn. »*\n\n**Après** : *« Votre photo de profil vous fait perdre des clients avant même qu'ils lisent votre titre.*\n\n*3 erreurs que je vois chaque semaine :*\n*→ Photo de mariage recadrée*\n*→ Lunettes de soleil*\n*→ Visage minuscule sur un paysage*\n\n*La règle : visage net, regard caméra, fond neutre, 60 % du cadre.*\n\n*Quelle est votre photo actuelle : pro ou vacances ? »*"}], "key_takeaways": ["L'accroche décide si le contenu est lu", "7 types d'accroches : chiffre, contre-intuitif, question, histoire, promesse, avant/après, identification", "Structures : PAS, histoire en 4 temps, liste actionnable", "Un seul appel à l'action, adapté à l'objectif"], "exercises": [{"title": "Atelier d'accroches", "instructions_markdown": "Prenez un sujet de votre calendrier. Écrivez **7 accroches**, une par type. Choisissez la meilleure, rédigez le contenu complet avec l'une des 3 structures et terminez par un CTA adapté à son objectif.", "difficulty": "moyen", "estimated_minutes": 40, "solution_markdown": "**Exemple corrigé** (sujet : trouver des idées de contenus) :\n\n1. Chiffre : *« 47 idées de posts pour ceux qui pensent n'avoir rien à dire. »*\n2. Contre-intuitif : *« Vous n'avez pas un problème d'inspiration. Vous avez un problème d'écoute. »*\n3. Question : *« Pourquoi certains créateurs ne sont-ils jamais à court d'idées ? »*\n4. Histoire : *« Un lundi, j'ai fixé mon écran 40 minutes sans rien écrire. »*\n5. Promesse : *« La méthode pour ne plus jamais chercher quoi publier. »*\n6. Avant / après : *« Avant, je cherchais une idée par jour. Maintenant j'en ai 200 d'avance. »*\n7. Identification : *« Si vous ouvrez LinkedIn en vous disant « bon, je poste quoi ? », ce post est pour vous. »*\n\nLa n°2 est souvent la plus forte : elle surprend et amène naturellement la méthode (banque d'idées), puis un CTA « Enregistrez ce post »."}], "common_mistakes": ["Commencer par « Aujourd'hui je voulais vous parler de… »", "Mettre 3 appels à l'action différents", "Accroche racoleuse qui ne tient pas sa promesse"], "resources": [{"title": "Contagious — Jonah Berger", "type": "livre", "description": "Pourquoi certaines idées se partagent et d'autres non."}, {"title": "Écrire pour convaincre (ressources de copywriting)", "type": "article", "description": "Cherchez les ressources sur les formules AIDA et PAS pour approfondir."}], "video_script_markdown": "", "slides": []}}, {"id": "4f7364409d3f", "plan": {"title": "Les formats et le système de production", "summary": "Maîtriser les formats clés et produire efficacement grâce au batching et au recyclage.", "objectives": ["Choisir les bons formats pour chaque réseau", "Mettre en place un système de production par lots", "Recycler un contenu en plusieurs formats"], "duration_minutes": 35, "format": "démonstration + atelier"}, "content": {"introduction_markdown": "La régularité ne dépend pas de la motivation, mais d'un **système**. Cette leçon vous donne une méthode pour produire un mois de contenus en quelques sessions, sans y passer vos soirées.", "sections": [{"heading": "Les formats incontournables", "content_markdown": "- **Post texte** : rapide, idéal pour les opinions et les histoires (LinkedIn, X).\n- **Carrousel** : très sauvegardé, parfait pour les méthodes étape par étape (LinkedIn, Instagram).\n- **Vidéo courte (Reels, TikTok, Shorts)** : forte découverte ; accroche visuelle et orale dans les 2 premières secondes, sous-titres obligatoires (beaucoup regardent sans le son).\n- **Vidéo longue** : crée une confiance profonde et reste trouvable des années (YouTube).\n- **Stories / lives** : proximité, coulisses, questions-réponses.\n- **Newsletter** : relation directe, idéale pour vendre."}, {"heading": "Le batching : produire par lots", "content_markdown": "Regroupez les tâches semblables au lieu de tout faire chaque jour :\n\n| Session | Durée | Tâche |\n|---|---|---|\n| 1 | 1 h | Choisir 12 sujets dans la banque d'idées |\n| 2 | 2 h | Rédiger tous les textes et scripts |\n| 3 | 2 h | Tourner toutes les vidéos (même tenue, même lumière) |\n| 4 | 1 h 30 | Créer les visuels à partir de vos modèles |\n| 5 | 30 min | Programmer les publications |\n\nEnviron **7 heures par mois** pour 12 contenus, au lieu de 1 h de stress par jour."}, {"heading": "Le recyclage : 1 idée, 5 contenus", "content_markdown": "Une même idée peut devenir :\n\n1. Une **vidéo longue** ou un article (contenu « pilier »)\n2. Un **carrousel** avec les étapes clés\n3. Une **vidéo courte** avec le conseil le plus surprenant\n4. Un **post texte** racontant l'histoire derrière\n5. Une **newsletter** qui approfondit avec un exemple\n\nVotre audience ne voit pas tout : répéter une bonne idée sous une autre forme **n'est pas du radotage, c'est de la pédagogie**."}], "examples": [{"title": "Une idée, une semaine de contenus", "content_markdown": "Un formateur en prise de parole enregistre une vidéo YouTube de 12 minutes « Comment ne plus trembler avant une présentation ». Il en tire : un carrousel « 5 techniques anti-trac », 3 Reels (respiration, première phrase, regard), un post LinkedIn racontant sa pire présentation et sa newsletter de la semaine. **Une seule session de réflexion, sept publications.**"}], "key_takeaways": ["La régularité vient d'un système, pas de la motivation", "Le batching regroupe les tâches similaires", "Une idée pilier peut devenir 5 contenus", "Sous-titrez toujours vos vidéos"], "exercises": [{"title": "Votre première session de batching", "instructions_markdown": "Planifiez et réalisez une session de production : choisissez 1 idée pilier, puis déclinez-la en au moins 4 formats adaptés à vos réseaux. Chronométrez le temps passé sur chaque étape.", "difficulty": "difficile", "estimated_minutes": 180, "solution_markdown": "**Déroulé attendu** :\n\n1. Idée pilier choisie dans la banque d'idées (≈ 10 min).\n2. Plan du contenu pilier en 5 points (≈ 20 min).\n3. Rédaction / tournage du contenu pilier (≈ 60 min).\n4. Déclinaisons : carrousel (≈ 30 min avec modèle), vidéo courte (≈ 20 min), post texte (≈ 15 min), newsletter (≈ 25 min).\n\n**Analyse** : repérez l'étape la plus longue. C'est souvent la création visuelle : investissez alors 1 h dans 3 modèles réutilisables, vous la diviserez par deux dès la session suivante."}], "common_mistakes": ["Créer chaque contenu à la dernière minute", "Publier des vidéos sans sous-titres", "Penser qu'il faut toujours de nouvelles idées"], "resources": [{"title": "CapCut", "type": "outil", "description": "Montage vidéo mobile et ordinateur, sous-titres automatiques."}, {"title": "Buffer / Metricool", "type": "outil", "description": "Programmation des publications sur plusieurs réseaux."}], "video_script_markdown": "", "slides": []}}], "quiz": {"title": "Quiz — Créer du contenu qui marque", "instructions": "Choisissez la ou les bonnes réponses, puis validez pour voir les explications.", "passing_score_percent": 70, "questions": [{"question": "Quel est l'équilibre de repère entre contenus attirer / nourrir / convertir ?", "type": "choix_unique", "options": ["100 / 0 / 0", "40 / 40 / 20", "10 / 10 / 80", "33 / 33 / 33 en publiant uniquement des offres"], "correct_indexes": [1], "explanation": "Environ 40 % pour attirer, 40 % pour créer la confiance et 20 % pour convertir.", "bloom_level": "se souvenir"}, {"question": "Quelle accroche est de type « contre-intuitif » ?", "type": "choix_unique", "options": ["Aujourd'hui je vais vous parler de LinkedIn", "Arrêtez de publier tous les jours", "Voici mon nouveau post", "Merci pour vos 1 000 abonnés"], "correct_indexes": [1], "explanation": "Elle prend le contre-pied d'une idée reçue et crée la surprise.", "bloom_level": "appliquer"}, {"question": "Combien d'appels à l'action faut-il idéalement à la fin d'un contenu ?", "type": "choix_unique", "options": ["Aucun", "Un seul, adapté à l'objectif du contenu", "Trois pour multiplier les chances", "Autant que possible"], "correct_indexes": [1], "explanation": "Plusieurs CTA dispersent l'attention ; un seul CTA clair est plus souvent suivi.", "bloom_level": "comprendre"}, {"question": "Republier une bonne idée sous un autre format est une perte de temps pour l'audience.", "type": "vrai_faux", "options": ["Vrai", "Faux"], "correct_indexes": [1], "explanation": "Votre audience ne voit pas tout ; la répétition sous d'autres formes renforce le message.", "bloom_level": "évaluer"}, {"question": "Quels sont les avantages du batching ?", "type": "choix_multiple", "options": ["Gain de temps grâce au regroupement des tâches", "Régularité de publication", "Moins de stress quotidien", "Il rend inutile toute planification"], "correct_indexes": [0, 1, 2], "explanation": "Le batching repose justement sur la planification.", "bloom_level": "analyser"}]}}, {"id": "9d5bb369a492", "title": "Exploser sur les réseaux", "summary": "Comprendre les algorithmes, optimiser son profil, activer les leviers de croissance et piloter par les chiffres.", "objectives": ["Optimiser son profil", "Accélérer sa croissance", "Mesurer et ajuster"], "lessons": [{"id": "3ad108525320", "plan": {"title": "Comprendre les algorithmes et optimiser son profil", "summary": "Savoir ce que récompensent les plateformes et transformer son profil en page d'accueil qui convertit.", "objectives": ["Expliquer les signaux qui favorisent la diffusion d'un contenu", "Optimiser photo, titre, bio et lien de son profil", "Mettre en place un contenu épinglé stratégique"], "duration_minutes": 30, "format": "texte + audit"}, "content": {"introduction_markdown": "Chaque plateforme a ses règles, qui changent souvent. Mais toutes cherchent la même chose : **garder les utilisateurs le plus longtemps possible**. Comprendre ce principe vaut mieux que courir après chaque « astuce algorithme ». Et quand un contenu vous amène un visiteur, c'est votre **profil** qui décide s'il s'abonne.", "sections": [{"heading": "Ce que les algorithmes récompensent", "content_markdown": "De manière générale, un contenu est davantage diffusé quand il génère :\n\n- **Du temps passé** : vidéo regardée jusqu'au bout, carrousel parcouru, post lu en entier.\n- **Des interactions de qualité** : commentaires développés, partages, sauvegardes (plus précieux qu'un simple « j'aime »).\n- **Des réactions rapides** après la publication, qui signalent un intérêt.\n\nConséquences pratiques : soignez l'accroche (rétention), posez une vraie question (commentaires), apportez de la valeur réutilisable (sauvegardes), et **répondez aux commentaires** dans la première heure."}, {"heading": "Le profil : votre vitrine", "content_markdown": "Un visiteur décide en quelques secondes. Checklist :\n\n| Élément | Bonne pratique |\n|---|---|\n| **Photo** | Visage net, souriant, fond neutre, identique partout |\n| **Nom** | Votre nom (+ éventuellement votre spécialité sur certains réseaux) |\n| **Titre / bio** | Votre phrase de positionnement : pour qui, quel résultat |\n| **Preuve** | Un chiffre, une référence, un résultat client |\n| **Appel à l'action** | Ce que le visiteur doit faire : télécharger, s'abonner, réserver |\n| **Lien** | Une page claire (ressource gratuite ou prise de rendez-vous), pas 12 liens |"}, {"heading": "Le contenu épinglé", "content_markdown": "Épinglez en haut de votre profil 1 à 3 contenus qui répondent à : **Qui êtes-vous ? Que pouvez-vous m'apporter ? Comment travailler avec vous ?** Par exemple : votre histoire (leçon 1.3), votre meilleur contenu de méthode, un témoignage client."}], "examples": [{"title": "Bio avant / après", "content_markdown": "**Avant** : *« Passionnée de marketing 🌸 | Maman | Café addict ☕ »*\n\n**Après** : *« J'aide les thérapeutes à remplir leur agenda avec Instagram 🌿 | +120 praticiens accompagnés | 👇 Mon guide gratuit : 30 idées de posts »*\n\nLa seconde dit **pour qui**, **quel résultat**, apporte **une preuve** et donne **une action**."}], "key_takeaways": ["Les plateformes récompensent le temps passé et les interactions de qualité", "Commentaires, partages et sauvegardes valent plus que des « j'aime »", "Répondez aux commentaires rapidement", "Profil = photo + promesse + preuve + action + lien unique", "Épinglez vos 3 contenus les plus stratégiques"], "exercises": [{"title": "Audit de profil", "instructions_markdown": "Faites une capture de votre profil actuel. Notez chaque élément de la checklist sur 2 (0 = absent, 1 = moyen, 2 = excellent). Réécrivez tous les éléments notés sous 2, puis choisissez vos 3 contenus à épingler.", "difficulty": "facile", "estimated_minutes": 30, "solution_markdown": "**Barème** : sur 12 points (6 éléments × 2).\n\n- **0 à 5** : votre profil fait fuir les visiteurs ; priorité absolue avant de chercher plus de visibilité.\n- **6 à 9** : correct, mais vous perdez des abonnés potentiels ; travaillez la preuve et l'appel à l'action.\n- **10 à 12** : excellent, concentrez-vous sur la création de contenu.\n\nL'erreur la plus fréquente : une bio qui parle de **vous** (passions, traits de caractère) au lieu de parler du **résultat pour le visiteur**."}], "common_mistakes": ["Chercher des astuces pour « tromper » l'algorithme", "Bio centrée sur soi au lieu du bénéfice client", "Un lien vers une page d'accueil générique"], "resources": [{"title": "Centres d'aide officiels des plateformes (LinkedIn, Instagram, TikTok, YouTube)", "type": "documentation", "description": "Les plateformes publient elles-mêmes des conseils sur ce qui favorise la recommandation de contenus."}], "video_script_markdown": "", "slides": []}}, {"id": "66075e4045b5", "plan": {"title": "Les leviers de croissance", "summary": "Accélérer sa croissance avec l'engagement, les collaborations et les contenus à fort potentiel de partage.", "objectives": ["Pratiquer l'engagement stratégique", "Mettre en place des collaborations", "Créer des contenus conçus pour être partagés"], "duration_minutes": 30, "format": "texte + plan d'action"}, "content": {"introduction_markdown": "Publier ne suffit pas au début : personne ne vous connaît encore. Pour accélérer, il faut **aller chercher l'attention là où elle se trouve déjà** et donner aux gens des raisons de partager vos contenus.", "sections": [{"heading": "L'engagement stratégique (la routine des 20 minutes)", "content_markdown": "Chaque jour, 20 minutes :\n\n1. **Listez 20 à 30 comptes** suivis par votre persona (créateurs de la niche, médias, clients potentiels).\n2. **Laissez 5 à 10 commentaires qui apportent de la valeur** : un complément, un exemple, un avis argumenté. Jamais « Super post ! 👏 ».\n3. **Répondez à tous les commentaires** reçus sur vos propres contenus.\n\nUn commentaire pertinent sur un compte suivi par des milliers de personnes est un **mini-contenu vu par votre cible**."}, {"heading": "Les collaborations", "content_markdown": "Empruntez l'audience des autres, en échange de valeur :\n\n- **Interviews croisées** : vous recevez un expert, il vous reçoit.\n- **Lives à deux** sur Instagram, LinkedIn ou TikTok.\n- **Contenus co-signés** (collab Instagram, carrousel commun).\n- **Invité** dans des podcasts, newsletters, webinaires.\n\nCiblez des profils **complémentaires et non concurrents**, avec une audience proche de la vôtre (une nutritionniste et un coach sportif, par exemple). Commencez par des comptes de taille similaire."}, {"heading": "Créer pour être partagé", "content_markdown": "On partage un contenu quand il nous **fait bien paraître**, nous **est utile** ou **exprime ce qu'on pense**. Formats à fort potentiel :\n\n- Les **ressources de référence** (checklist, modèle, glossaire)\n- Les **opinions tranchées** sur un débat de la niche\n- Les **contenus d'identification** (« Les 7 étapes de tout freelance le lundi matin »)\n- Les **données originales** (votre propre mini-sondage ou analyse)"}, {"heading": "Tendances : à utiliser avec discernement", "content_markdown": "Surfer sur un son, un format ou une actualité peut apporter un pic de vues. Mais adaptez toujours la tendance **à votre positionnement** : une tendance sans lien avec votre expertise attire une audience qui n'achètera jamais."}], "examples": [{"title": "La routine qui fait décoller", "content_markdown": "Un consultant en cybersécurité démarre LinkedIn avec quelques centaines de relations. Pendant 3 mois, il publie 3 posts par semaine **e
